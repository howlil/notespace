name: Format M4 Go Sources
on:
  push:
    branches:
      - feat/desktop-m4-recovery-backup
    paths:
      - "apps/server/internal/sqlite/manual_snapshot.go"
      - "apps/server/internal/sqlite/manual_snapshot_test.go"
      - "apps/server/cmd/notespace/main.go"
      - ".github/workflows/format-m4-go.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-m4-recovery-backup
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: gofmt -w apps/server/internal/sqlite/manual_snapshot.go apps/server/internal/sqlite/manual_snapshot_test.go apps/server/cmd/notespace/main.go
      - name: Commit formatted Go sources
        run: |
          git add apps/server/internal/sqlite/manual_snapshot.go apps/server/internal/sqlite/manual_snapshot_test.go apps/server/cmd/notespace/main.go
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(m4): format SQLite backup worker with gofmt"
          git push origin HEAD:feat/desktop-m4-recovery-backup
