name: Move Quick Capture to sidebar

on:
  push:
    branches: [master]
    paths: [.github/workflows/quick-capture-sidebar.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Move Quick Capture trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path

          quick = Path('apps/web/src/features/capture/QuickCapture.tsx')
          text = quick.read_text()
          text = text.replace('import { useRouterState } from "@tanstack/react-router";\n', '')
          text = text.replace('import { FileUp, Plus } from "lucide-react";', 'import { FileUp, SquarePen } from "lucide-react";')
          text = text.replace('import { Button, Dialog, DialogContent, DialogDescription, DialogFooter, DialogTitle } from "../../components/ui";', 'import { Button, Dialog, DialogContent, DialogDescription, DialogFooter, DialogTitle, IconButton } from "../../components/ui";')
          text = text.replace('  const pathname = useRouterState({ select: (state) => state.location.pathname });\n  const librarySurface = !/^\\/(?:workspaces|projects)\\//.test(pathname);\n', '')
          text = text.replace('    if (!librarySurface) return;\n', '')
          text = text.replace('  }, [librarySurface]);', '  }, []);')
          text = text.replace('  if (!librarySurface) return null;\n\n', '')
          old_trigger = '''      <Button\n        type="button"\n        variant="secondary"\n        size="sm"\n        className="fixed bottom-4 right-4 z-30 shadow-sm"\n        onClick={() => setOpen(true)}\n        aria-label="Quick capture"\n      >\n        <Plus size={14} aria-hidden="true" />\n        Quick capture\n      </Button>'''
          new_trigger = '''      <IconButton\n        type="button"\n        className="size-[30px] text-muted hover:bg-tint hover:text-accent focus-visible:bg-tint focus-visible:text-accent"\n        onClick={() => setOpen(true)}\n        aria-label="Quick capture"\n        title="Quick capture (Ctrl/Cmd + Shift + N)"\n      >\n        <SquarePen size={16} aria-hidden="true" />\n      </IconButton>'''
          if old_trigger not in text:
              raise SystemExit('Quick Capture trigger shape changed; refusing blind patch')
          quick.write_text(text.replace(old_trigger, new_trigger))

          sidebar = Path('apps/web/src/components/layout/Sidebar.tsx')
          text = sidebar.read_text()
          anchor = 'import { createCategory, createProject, deleteCategory, deleteProject, listCategoryWorkspaces, moveProject, renameProject, updateCategory } from "../../domain/project/api";\n'
          if anchor not in text:
              raise SystemExit('Sidebar import anchor missing')
          text = text.replace(anchor, anchor + 'import { QuickCapture } from "../../features/capture/QuickCapture";\n', 1)
          workspace_action = '          <IconButton className="size-[30px] text-muted hover:bg-tint hover:text-accent focus-visible:bg-tint focus-visible:text-accent" aria-label="New workspace" title={uncategorized ? "New workspace in Uncategorized" : "New workspace"} onClick={() => startCreate("workspace", uncategorized?.id)}><FilePlus2 size={16} /></IconButton>\n'
          if workspace_action not in text:
              raise SystemExit('New workspace action anchor missing')
          text = text.replace(workspace_action, workspace_action + '          <QuickCapture />\n', 1)
          sidebar.write_text(text)

          root = Path('apps/web/src/routes/__root.tsx')
          text = root.read_text()
          text = text.replace('import { QuickCapture } from "../features/capture/QuickCapture";\n', '')
          text = text.replace('          <Outlet />\n          <QuickCapture />', '          <Outlet />')
          root.write_text(text)
          PY

          rm .github/workflows/quick-capture-sidebar.yml
          git diff --check
          git diff --exit-code -- apps/web/src/features/capture/QuickCapture.tsx apps/web/src/components/layout/Sidebar.tsx apps/web/src/routes/__root.tsx >/dev/null && {
            echo "No source changes produced" >&2
            exit 1
          }
      - name: Commit directly to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/capture/QuickCapture.tsx apps/web/src/components/layout/Sidebar.tsx apps/web/src/routes/__root.tsx .github/workflows/quick-capture-sidebar.yml
          git commit -m "feat(web): move quick capture to sidebar"
          git push origin HEAD:master
