name: Verify landing hero design lab

on:
  pull_request:
    paths:
      - "landing/**"
      - ".github/workflows/verify-hero-lab.yml"

jobs:
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check generated static lab route
        run: test -f dist/hero-lab/index.html && test -f dist/index.html
