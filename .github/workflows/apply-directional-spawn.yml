name: Apply directional spawn
on:
  push:
    paths:
      - .github/workflows/apply-directional-spawn.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Apply directional spawn implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          helper = '''import {
            getCatalogItem,
            makeDiagramId,
            type IdFactory,
            type StructuredDiagram,
          } from "../../features/diagram/diagram-model";

          export type DirectionalSpawnDirection = "left" | "right" | "up" | "down";

          type Box = { x: number; y: number; width: number; height: number };

          export const DIRECTIONAL_SPAWN_GAP = 120;

          export function directionFromKey(key: string): DirectionalSpawnDirection | null {
            if (key === "ArrowLeft") return "left";
            if (key === "ArrowRight") return "right";
            if (key === "ArrowUp") return "up";
            if (key === "ArrowDown") return "down";
            return null;
          }

          export function directionalSpawnPosition(
            source: Box,
            direction: DirectionalSpawnDirection,
            gap = DIRECTIONAL_SPAWN_GAP,
          ) {
            if (direction === "left") return { x: source.x - source.width - gap, y: source.y };
            if (direction === "right") return { x: source.x + source.width + gap, y: source.y };
            if (direction === "up") return { x: source.x, y: source.y - source.height - gap };
            return { x: source.x, y: source.y + source.height + gap };
          }

          export function spawnConnectedStructuredNode(
            diagram: StructuredDiagram,
            sourceNodeId: string,
            direction: DirectionalSpawnDirection,
            gap = DIRECTIONAL_SPAWN_GAP,
            idFactory: IdFactory = makeDiagramId,
          ) {
            const source = diagram.nodes.find((node) => node.id === sourceNodeId);
            if (!source) return null;

            const item = getCatalogItem(source.specKey);
            const position = directionalSpawnPosition(source, direction, gap);
            const nodeId = idFactory("node");
            const node = {
              ...source,
              id: nodeId,
              elementId: idFactory("shape"),
              label: item.label,
              x: position.x,
              y: position.y,
            };
            const edge = {
              id: idFactory("edge"),
              from: source.id,
              to: node.id,
              label: "",
              elementId: idFactory("arrow"),
            };
            const groups = source.groupId
              ? diagram.groups.map((group) => group.id === source.groupId
                ? { ...group, nodeIds: [...group.nodeIds, node.id] }
                : group)
              : diagram.groups;

            return {
              diagram: {
                ...diagram,
                nodes: [...diagram.nodes, node],
                edges: [...diagram.edges, edge],
                groups,
              },
              nodeId,
              edgeId: edge.id,
            };
          }

          type NativeShapeSource = Box & {
            id: string;
            type: string;
            strokeColor: string;
            backgroundColor: string;
            fillStyle: string;
            strokeWidth: number;
            strokeStyle: string;
            roughness: number;
            opacity: number;
            roundness?: unknown;
          };

          const nativeShapeTypes = new Set(["rectangle", "ellipse", "diamond"]);

          export function nativeDirectionalSpawnPlan(
            source: NativeShapeSource,
            direction: DirectionalSpawnDirection,
            gap = DIRECTIONAL_SPAWN_GAP,
            idFactory: IdFactory = makeDiagramId,
          ) {
            if (!nativeShapeTypes.has(source.type)) return null;
            const position = directionalSpawnPosition(source, direction, gap);
            const shapeId = idFactory("shape");
            const arrowId = idFactory("arrow");
            const shape = {
              type: source.type,
              id: shapeId,
              ...position,
              width: source.width,
              height: source.height,
              strokeColor: source.strokeColor,
              backgroundColor: source.backgroundColor,
              fillStyle: source.fillStyle,
              strokeWidth: source.strokeWidth,
              strokeStyle: source.strokeStyle,
              roughness: source.roughness,
              opacity: source.opacity,
              ...(source.roundness ? { roundness: source.roundness } : {}),
            };
            const arrow = {
              type: "arrow",
              id: arrowId,
              x: 0,
              y: 0,
              strokeColor: source.strokeColor,
              strokeWidth: source.strokeWidth,
              strokeStyle: "solid",
              roughness: source.roughness,
              opacity: source.opacity,
              endArrowhead: "arrow",
              start: { id: source.id },
              end: { id: shapeId },
            };
            return { shapeId, arrowId, skeletons: [shape, arrow] };
          }
          '''
          Path("apps/web/src/integrations/canvas/CanvasDirectionalSpawn.ts").write_text(helper)

          editor_path = Path("apps/web/src/integrations/canvas/CanvasEditor.tsx")
          editor = editor_path.read_text()
          editor = editor.replace(
            'import { CaptureUpdateAction, Excalidraw, reconcileElements, useHandleLibrary } from "@excalidraw/excalidraw";',
            'import { CaptureUpdateAction, Excalidraw, convertToExcalidrawElements, reconcileElements, useHandleLibrary } from "@excalidraw/excalidraw";',
          )
          editor = editor.replace(
            'import type { OrderedExcalidrawElement } from "@excalidraw/excalidraw/element/types";',
            'import type { OrderedExcalidrawElement } from "@excalidraw/excalidraw/element/types";\nimport type { ExcalidrawElementSkeleton } from "@excalidraw/excalidraw/element/transform";',
          )
          editor = editor.replace(
            'import { useCallback, useEffect, useMemo, useRef, useState } from "react";',
            'import { type KeyboardEvent as ReactKeyboardEvent, useCallback, useEffect, useMemo, useRef, useState } from "react";',
          )
          editor = editor.replace(
            'import { forgetDiagramHistory, mergeDiagramHistory, sameDiagramSelection, sameStructuredDiagrams } from "./canvas-state";\nimport { replaceStructuredDiagramElements } from "./diagram-excalidraw";',
            'import { forgetDiagramHistory, mergeDiagramHistory, sameDiagramSelection, sameStructuredDiagrams } from "./canvas-state";\nimport { directionFromKey, nativeDirectionalSpawnPlan, spawnConnectedStructuredNode } from "./CanvasDirectionalSpawn";\nimport { replaceStructuredDiagramElements } from "./diagram-excalidraw";',
          )
          old_apply = '''  const applyDiagram = useCallback(async (previous: StructuredDiagram | null, next: StructuredDiagram) => {
            const value = api.current;
            if (!value) return;
            await document.fonts.ready;
            const iconLoad = await ensureEraserDiagramIconFiles(value, next, workspaceId);
            if (iconLoad.failed.length) {
              showToast({ kind: "error", message: "Some Eraser icons could not load. Text fallback was kept for those nodes." });
            }
            const nextElements = replaceStructuredDiagramElements(value.getSceneElements(), previous, next, dark, iconLoad.available);
            const nextDiagrams = previous
              ? diagramsRef.current.map((diagram) => diagram.id === previous.id ? next : diagram)
              : [...diagramsRef.current, next];
            updateDiagramState(nextDiagrams);
            setLastDiagramId(next.id);
            updateDiagramSelection({ diagramId: next.id, nodeIds: [], edgeId: null, groupId: null });
            value.updateScene({ elements: nextElements, appState: { selectedElementIds: {} }, captureUpdate: CaptureUpdateAction.IMMEDIATELY });
            emitSnapshot(nextElements, value.getAppState(), nextDiagrams);
          }, [dark, emitSnapshot, showToast, updateDiagramSelection, updateDiagramState, workspaceId]);'''
          new_apply = '''  const applyDiagram = useCallback(async (
            previous: StructuredDiagram | null,
            next: StructuredDiagram,
            options: { selectNodeId?: string } = {},
          ) => {
            const value = api.current;
            if (!value) return;
            await document.fonts.ready;
            const iconLoad = await ensureEraserDiagramIconFiles(value, next, workspaceId);
            if (iconLoad.failed.length) {
              showToast({ kind: "error", message: "Some Eraser icons could not load. Text fallback was kept for those nodes." });
            }
            const nextElements = replaceStructuredDiagramElements(value.getSceneElements(), previous, next, dark, iconLoad.available);
            const nextDiagrams = previous
              ? diagramsRef.current.map((diagram) => diagram.id === previous.id ? next : diagram)
              : [...diagramsRef.current, next];
            const selectedNode = options.selectNodeId ? next.nodes.find((node) => node.id === options.selectNodeId) ?? null : null;
            const selectedElementIds = selectedNode ? { [selectedNode.elementId]: true } : {};
            updateDiagramState(nextDiagrams);
            setLastDiagramId(next.id);
            updateDiagramSelection({ diagramId: next.id, nodeIds: selectedNode ? [selectedNode.id] : [], edgeId: null, groupId: null });
            value.updateScene({ elements: nextElements, appState: { selectedElementIds }, captureUpdate: CaptureUpdateAction.IMMEDIATELY });
            emitSnapshot(nextElements, value.getAppState(), nextDiagrams);
          }, [dark, emitSnapshot, showToast, updateDiagramSelection, updateDiagramState, workspaceId]);'''
          if old_apply not in editor:
            raise SystemExit("applyDiagram target not found")
          editor = editor.replace(old_apply, new_apply)

          marker = '''  const detachDiagram = useCallback(() => {
            if (!activeDiagram || !api.current) return;
            const nextDiagrams = diagramsRef.current.filter((diagram) => diagram.id !== activeDiagram.id);
            diagramHistoryRef.current = forgetDiagramHistory(diagramHistoryRef.current, activeDiagram.id);
            updateDiagramState(nextDiagrams);
            updateDiagramSelection(emptyDiagramSelection());
            setLastDiagramId(nextDiagrams.at(-1)?.id ?? null);
            emitSnapshot(api.current.getSceneElements(), api.current.getAppState(), nextDiagrams);
            showToast({ kind: "success", message: "Diagram detached. Its Excalidraw shapes remain fully editable." });
          }, [activeDiagram, emitSnapshot, showToast, updateDiagramSelection, updateDiagramState]);
'''
          handler = marker + '''
          const handleDirectionalSpawnKeyDown = useCallback((event: ReactKeyboardEvent<HTMLDivElement>) => {
            const direction = directionFromKey(event.key);
            if (!direction || !event.altKey || event.ctrlKey || event.metaKey || event.shiftKey) return;
            const target = event.target;
            if (target instanceof HTMLElement && (target.isContentEditable || target.closest("input, textarea, select, [contenteditable='true']"))) return;

            const value = api.current;
            if (!value) return;
            const state = value.getAppState() as AppState & { editingLinearElement?: unknown };
            if (state.editingTextElement || state.editingLinearElement || state.openDialog) return;
            const selectedIds = Object.entries(state.selectedElementIds).filter(([, selected]) => selected).map(([id]) => id);
            if (selectedIds.length !== 1) return;

            if (activeDiagram && diagramSelection.nodeIds.length === 1) {
              const result = spawnConnectedStructuredNode(activeDiagram, diagramSelection.nodeIds[0], direction);
              if (!result) return;
              event.preventDefault();
              event.stopPropagation();
              void applyDiagram(activeDiagram, result.diagram, { selectNodeId: result.nodeId });
              return;
            }

            const scene = value.getSceneElements();
            const source = scene.find((element) => element.id === selectedIds[0] && !element.isDeleted);
            if (!source) return;
            const plan = nativeDirectionalSpawnPlan(source, direction);
            if (!plan) return;

            event.preventDefault();
            event.stopPropagation();
            const created = convertToExcalidrawElements(plan.skeletons as ExcalidrawElementSkeleton[]) as OrderedExcalidrawElement[];
            const nextSource = {
              ...source,
              boundElements: [...(source.boundElements ?? []).filter((bound) => bound.id !== plan.arrowId), { id: plan.arrowId, type: "arrow" as const }],
            } as OrderedExcalidrawElement;
            const nextElements = [
              ...scene.map((element) => element.id === source.id ? nextSource : element),
              ...created,
            ];
            value.updateScene({
              elements: nextElements,
              appState: { selectedElementIds: { [plan.shapeId]: true } },
              captureUpdate: CaptureUpdateAction.IMMEDIATELY,
            });
          }, [activeDiagram, applyDiagram, diagramSelection.nodeIds]);
'''
          if marker not in editor:
            raise SystemExit("detachDiagram target not found")
          editor = editor.replace(marker, handler)
          editor = editor.replace(
            '<div className="notespace-canvas-surface relative min-h-0 w-full flex-1" aria-label="Workspace canvas">',
            '<div className="notespace-canvas-surface relative min-h-0 w-full flex-1" aria-label="Workspace canvas" onKeyDownCapture={handleDirectionalSpawnKeyDown}>',
          )
          editor_path.write_text(editor)

          test_path = Path("apps/web/src/features/diagram/diagram-model.test.ts")
          tests = test_path.read_text()
          tests = tests.replace(
            'import test from "node:test";\n',
            'import test from "node:test";\nimport { directionalSpawnPosition, spawnConnectedStructuredNode } from "../../integrations/canvas/CanvasDirectionalSpawn.ts";\n',
          )
          tests += '''

          test("directional spawn positions and connects a structured node", () => {
            const nextId = ids();
            const diagram = createDiagramWithNode("architecture", getCatalogItem("server"), { x: 40, y: 60 }, nextId);
            const source = diagram.nodes[0];
            const result = spawnConnectedStructuredNode(diagram, source.id, "right", 120, nextId);
            assert(result);
            const spawned = result.diagram.nodes.find((node) => node.id === result.nodeId);
            assert(spawned);
            assert.deepEqual(
              { x: spawned.x, y: spawned.y },
              directionalSpawnPosition(source, "right", 120),
            );
            assert.equal(result.diagram.edges.at(-1)?.from, source.id);
            assert.equal(result.diagram.edges.at(-1)?.to, spawned.id);
          });

          test("directional spawn keeps the new structured node inside its source group", () => {
            const nextId = ids();
            let diagram = threeNodeDiagram("architecture", nextId);
            diagram = groupDiagramNodes(diagram, [diagram.nodes[0].id, diagram.nodes[1].id], nextId);
            const source = diagram.nodes[0];
            const result = spawnConnectedStructuredNode(diagram, source.id, "down", 120, nextId);
            assert(result);
            const spawned = result.diagram.nodes.find((node) => node.id === result.nodeId);
            assert(spawned?.groupId);
            assert(result.diagram.groups.find((group) => group.id === spawned.groupId)?.nodeIds.includes(spawned.id));
          });
          '''
          test_path.write_text(tests)

          e2e_path = Path("tests/workspace.spec.ts")
          e2e = e2e_path.read_text()
          e2e += '''

          test("Alt+Arrow spawns and auto-connects a native canvas shape", async ({ page, request }) => {
            const id = await createViaAPI(page, request, `Directional spawn ${Date.now()}`);

            try {
              await selectView(page, "Canvas");
              const canvas = page.locator(".excalidraw__canvas.interactive");
              await expect(canvas).toBeVisible();
              const toolbar = page.getByRole("toolbar", { name: "Canvas tools" });
              await toolbar.getByRole("button", { name: "Rectangle", exact: true }).click();
              const bounds = await canvas.boundingBox();
              if (!bounds) throw new Error("Canvas did not render");
              const left = bounds.x + 220;
              const top = bounds.y + 180;
              await page.mouse.move(left, top);
              await page.mouse.down();
              await page.mouse.move(left + 120, top + 70, { steps: 8 });
              await page.mouse.up();
              await page.keyboard.press("Escape");
              await page.mouse.click(left + 60, top + 35);
              await page.keyboard.press("Alt+ArrowRight");

              await expect.poll(async () => {
                const stored = await (await request.get(`/api/workspaces/${id}`)).json() as {
                  canvas: { data: { elements: Array<{ type?: string; isDeleted?: boolean }> } };
                };
                const live = stored.canvas.data.elements.filter((element) => !element.isDeleted);
                return {
                  rectangles: live.filter((element) => element.type === "rectangle").length,
                  arrows: live.filter((element) => element.type === "arrow").length,
                };
              }).toEqual({ rectangles: 2, arrows: 1 });
            } finally {
              await cleanup(request, id);
            }
          });
          '''
          e2e_path.write_text(e2e)
          PY
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/integrations/canvas/CanvasDirectionalSpawn.ts apps/web/src/integrations/canvas/CanvasEditor.tsx apps/web/src/features/diagram/diagram-model.test.ts tests/workspace.spec.ts
          git commit -m "feat(canvas): spawn connected shapes with Alt+Arrow"
          git push origin HEAD:master
