name: Verify
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  verify:
    # Chrome is available on the runner; WebdriverIO manages the driver.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: bun install --frozen-lockfile
      - name: Build web for PR
        if: github.event_name == 'pull_request'
        run: bun run --filter @notespace/web build
      - name: Build web and landing on master
        if: github.event_name == 'push'
        run: bun run build
      - run: bun run typecheck && bun run lint && bun run test
      - run: node ../../scripts/verify/check-gofmt.mjs && go vet ./... && go test -race ./... && CGO_ENABLED=0 go build ./cmd/notespace
        working-directory: apps/server
      - name: Check WebdriverIO runner syntax
        run: node --check scripts/verify/browser-e2e.mjs
      # Fast PR proof; complete browser regression protects the release SHA.
      - name: Run critical browser suite on PR
        if: github.event_name == 'pull_request'
        run: bun run test:e2e:critical
      - name: Run critical WebdriverIO suite on master
        if: github.event_name == 'push'
        run: bun run test:e2e:critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/*.png
          retention-days: 7
      # Full deployment durability remains a fail-closed master release gate.
      - run: docker compose -f compose.yaml config
        if: github.event_name == 'push'
      - run: docker compose -f compose.yaml -f compose.ci.yaml up --build -d --wait
        if: github.event_name == 'push'
      - run: python3 scripts/verify/smoke-persistence.py --compose-restart
        if: github.event_name == 'push'
        env:
          COMPOSE_FILE: compose.yaml:compose.ci.yaml
      - run: docker compose -f compose.yaml -f compose.ci.yaml logs && docker compose -f compose.yaml -f compose.ci.yaml down
        if: always() && github.event_name == 'push'
