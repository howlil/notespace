name: Fix Editor Markdown

on:
  push:
    branches: [feat/editor-completeness]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[markdown-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated Markdown export typos
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/domain/document/markdown.ts')
          text = path.read_text()
          text = text.replace('codeBllock', 'codeBlock')
          text = text.replace(r'${language}\l${inline()}', r'${language}\n${inline()}')
          path.write_text(text)
          PY

          if git diff --quiet; then
            exit 0
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/domain/document/markdown.ts
          git commit -m 'fix(editor): correct Markdown code export [markdown-fix]'
          git push
