name: Editor Compat Finalize

on:
  push:
    branches: [feat/editor-completeness]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[compat-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch Markdown compatibility and remove temporary workflows
        shell: bash
        env:
          PATCH_BASE64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          Path('/tmp/patch.py').write_bytes(base64.b64decode(os.environ['PATCH_BASE64']))
          PY
          python /tmp/patch.py
          git rm .github/workflows/editor-compat-finalize.yml .github/workflows/lockfile-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/domain/document/markdown.ts apps/web/src/domain/document/markdown.test.ts
          git commit -m 'feat(editor): preserve new structures in Markdown [compat-generated] [skip ci]'
          git push
