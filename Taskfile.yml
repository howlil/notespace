version: '3'

tasks:
  default:
    desc: List available Notespace tasks
    cmds:
      - task --list

  dev:
    desc: Run the web and Go development servers together
    deps:
      - dev:web
      - dev:server
    failfast: true

  dev:web:
    internal: true
    cmds:
      - bun dev

  dev:server:
    internal: true
    dir: apps/server
    env:
      NOTESPACE_DB: ../../data/dev/notespace.db
    cmds:
      - go run ./cmd/notespace

  check:
    desc: Run frontend and backend static checks and unit tests
    deps:
      - check:web
      - check:server
    failfast: true

  check:web:
    desc: Run frontend typecheck, lint, and unit tests
    cmds:
      - bun run typecheck
      - bun run lint
      - bun run test

  check:server:
    desc: Run Go formatting, vet, and race-test gates
    dir: apps/server
    cmds:
      - node ../../scripts/verify/check-gofmt.mjs
      - go vet ./...
      - go test -race ./...

  test:web:
    desc: Run one focused web unit test file (TEST=path/to/test.ts)
    requires:
      vars: [TEST]
    cmds:
      - node --experimental-strip-types --test "{{.TEST}}"

  test:server:
    desc: Run one focused Go package test (PACKAGE=./internal/package)
    dir: apps/server
    requires:
      vars: [PACKAGE]
    cmds:
      - go test -race "{{.PACKAGE}}"

  build:
    desc: Build the production web assets and Go binary
    cmds:
      - task: build:web
      - task: build:server

  build:web:
    internal: true
    cmds:
      - bun run build

  build:server:
    internal: true
    dir: bin
    cmds:
      - go -C ../apps/server build -o ../../bin/notespace{{exeExt}} ./cmd/notespace

  e2e:
    desc: Build the web app once and run every WebdriverIO browser journey
    cmds:
      - bun run test:e2e

  e2e:critical:
    desc: Build the web app and run only critical cross-system journeys
    cmds:
      - bun run --filter @notespace/web build
      - bun run test:e2e:critical

  e2e:smoke:
    desc: Build the web app and run risk-based durability/security smoke
    cmds:
      - bun run --filter @notespace/web build
      - bun run test:e2e:smoke

  e2e:affected:
    desc: Build and run affected owners plus smoke (CHANGED_FILES=repository-relative-paths.json)
    requires:
      vars: [CHANGED_FILES]
    cmds:
      - bun run --filter @notespace/web build
      - bun run test:e2e:affected --changed-files "{{.CHANGED_FILES}}"

  e2e:target:
    desc: Run one focused WebdriverIO journey file (SPEC=path/to/file.e2e.mjs)
    requires:
      vars: [SPEC]
    cmds:
      - bun run --filter @notespace/web build
      - node scripts/verify/browser-e2e.mjs --file "{{.SPEC}}"

  verify:
    desc: Run the full local release verification suite
    cmds:
      - task: build
      - task: check
      - bun run test:e2e:critical

  perf:evidence:
    desc: Run repeatable performance evidence checks
    cmds:
      - task: test:web
        vars:
          TEST: apps/web/src/features/workspace-authoring/canvas/state/canvas-scene-state.test.ts
      - task: perf:persistence

  perf:persistence:
    internal: true
    dir: apps/server
    env:
      NOTESPACE_SCALE_EVIDENCE: "1"
    cmds:
      - go test ./internal/sqlite -run TestPersistenceScaleEvidence -count=1

  up:
    desc: Build and start the self-hosted Docker Compose stack
    cmds:
      - docker compose up --build -d --wait

  down:
    desc: Stop the Docker Compose stack without deleting persisted data
    cmds:
      - docker compose down

  logs:
    desc: Follow Docker Compose logs
    cmds:
      - docker compose logs -f

  desktop:prepare:
    desc: Build web assets and prepare the native Go sidecar for the current Rust host target
    cmds:
      - bun run --filter @notespace/web build
      - bun run desktop:icons
      - node scripts/dev/prepare-desktop-sidecar.mjs

  desktop:test-shell:
    internal: true
    dir: apps/desktop/src-tauri
    cmds:
      - cargo test --locked

  desktop:check:
    desc: Prepare and test the desktop runtime shell
    deps:
      - desktop:prepare
    cmds:
      - bun run test:desktop:lifecycle
      - node scripts/verify/smoke-desktop-runtime.mjs
      - task: desktop:test-shell

  desktop:stop:
    desc: Stop running Notespace desktop processes that can lock the debug binaries
    cmds:
      - powershell -NoProfile -NonInteractive -File scripts/dev/stop-desktop-dev.ps1

  desktop:dev:
    desc: Run the desktop shell with Vite hot reload and the local Notespace runtime
    cmds:
      - task: desktop:stop
      - task: desktop:prepare
      - task: desktop:run

  desktop:run:
    internal: true
    dir: apps/desktop/src-tauri
    env:
      NOTESPACE_DEV_SERVER_URL: http://127.0.0.1:3000
    cmds:
      - cargo tauri dev

  desktop:build:
    desc: Build the desktop application for the current host platform
    deps:
      - desktop:prepare
    dir: apps/desktop/src-tauri
    cmds:
      - cargo tauri build -- --locked
