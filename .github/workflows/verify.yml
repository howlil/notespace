name: Verify
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck && pnpm lint && pnpm test
      - name: Verify Workspace-first read-only baseline
        run: python3 -m unittest discover -s scripts -p 'test_workspace_first_baseline.py' -v
      - name: M3 formatter snapshot (temporary)
        run: |
          for file in apps/server/internal/planning/tasks.go apps/server/internal/planning/store.go apps/server/internal/planning/test_helpers_test.go apps/server/internal/sqlite/planning_assign.go apps/server/internal/httpapi/planning_handlers.go apps/server/internal/httpapi/planning_test.go apps/server/internal/httpapi/router.go; do
            echo "FMT_M3_BEGIN:$file"
            gofmt "$file" | base64 -w0
            echo ""
            echo "FMT_M3_END:$file"
          done
      - run: node ../../scripts/check-gofmt.mjs && go vet ./... && go test -race ./... && CGO_ENABLED=0 go build ./cmd/notespace
        working-directory: apps/server
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run critical browser journeys
        if: github.event_name == 'pull_request'
        run: pnpm test:e2e:critical
      - name: Run full browser suite
        # M5: every PR must run the complete suite, not only @critical journeys.
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/*.png
            playwright-report/
          retention-days: 7
      - run: docker compose -f compose.yaml config
      - run: docker compose -f compose.yaml -f compose.ci.yaml up --build -d --wait
      - run: python3 scripts/smoke-persistence.py --compose-restart
        env:
          COMPOSE_FILE: compose.yaml:compose.ci.yaml
      - run: docker compose -f compose.yaml -f compose.ci.yaml logs && docker compose -f compose.yaml -f compose.ci.yaml down
        if: always()
