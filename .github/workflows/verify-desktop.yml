name: Verify Desktop

on:
  pull_request:
    paths:
      # Release-note-only opt-in commits must still validate this exact master SHA.
      - "docs/DESKTOP_BETA_RELEASE_*.md"
      - ".github/workflows/verify-desktop.yml"
      - ".agents/engineering.md"
      - "apps/desktop/**"
      - "apps/server/cmd/notespace/**"
      - "apps/server/internal/sqlite/**"
      - "apps/server/migrations/**"
      - "apps/web/**"
      - "package.json"
      - "tests/**"
      - "scripts/verify/desktop-webdriver-smoke.mjs"
      - "scripts/verify/native-close-session.mjs"
      - "scripts/verify/native-close-session.test.mjs"
      - "scripts/dev/diagnose-desktop-webdriver.ps1"
      - "scripts/dev/install-webview2-edgedriver.ps1"
      - "scripts/verify/check-desktop-webdriver-policy.test.mjs"
      - "scripts/release/assert-desktop-release-ci.mjs"
      - "scripts/release/resolve-desktop-release-version.mjs"
      - "scripts/release/desktop-release-automation.test.mjs"
      - ".github/workflows/publish-desktop.yml"
      - "scripts/release/desktop-upgrade-inventory.py"
      - "scripts/verify/test-desktop-upgrade-inventory.py"
      - "scripts/release/verify-desktop-msi-upgrade.ps1"
      - "scripts/release/create-desktop-update-manifest.mjs"
      - "scripts/release/create-desktop-update-manifest.test.mjs"
      - "scripts/release/create-desktop-beta-manifest.mjs"
      - "scripts/release/create-desktop-beta-manifest.test.mjs"
      - "scripts/release/prepare-desktop-updater-config.mjs"
      - "scripts/release/prepare-desktop-updater-config.test.mjs"
      - "scripts/release/prepare-desktop-windows-sign-config.mjs"
      - "scripts/release/prepare-desktop-windows-sign-config.test.mjs"
      - "scripts/release/check-desktop-release-security.test.mjs"
      - ".github/workflows/release-desktop.yml"
      - ".github/workflows/publish-desktop-beta.yml"
      - ".github/workflows/auto-desktop-beta.yml"
      - "scripts/release/resolve-desktop-beta-version.mjs"
      - "scripts/release/resolve-desktop-beta-version.test.mjs"
      - "scripts/verify/test-desktop-workflow-yaml.py"
      - "apps/server/cmd/notespace/desktop_boundary.go"
      - "apps/server/cmd/notespace/desktop_boundary_test.go"
      - "scripts/dev/prepare-desktop-sidecar.mjs"
      - "scripts/assets/prepare-desktop-icons.mjs"
      - "scripts/assets/assert-desktop-icon.ps1"
      - "scripts/assets/desktop-icon-contract.test.mjs"
      - "apps/web/public/brand/notespace-fox-full.svg"
      - "scripts/verify/assert-windows-pe-subsystem.mjs"
      - "scripts/verify/assert-windows-pe-subsystem.test.mjs"
      - "scripts/verify/smoke-desktop-sidecar-lifecycle.mjs"
      - "scripts/verify/smoke-desktop-runtime.mjs"
      - "Taskfile.yml"
      - "bun.lock"
  push:
    branches: [master]
    paths:
      # Release-note-only opt-in commits must still validate this exact master SHA.
      - "docs/DESKTOP_BETA_RELEASE_*.md"
      - ".github/workflows/verify-desktop.yml"
      - "apps/desktop/**"
      - "apps/server/cmd/notespace/**"
      - "apps/server/internal/sqlite/**"
      - "apps/server/migrations/**"
      - "apps/web/**"
      - "package.json"
      - "tests/**"
      - "scripts/verify/desktop-webdriver-smoke.mjs"
      - "scripts/verify/native-close-session.mjs"
      - "scripts/verify/native-close-session.test.mjs"
      - "scripts/dev/diagnose-desktop-webdriver.ps1"
      - "scripts/dev/install-webview2-edgedriver.ps1"
      - "scripts/verify/check-desktop-webdriver-policy.test.mjs"
      - "scripts/release/assert-desktop-release-ci.mjs"
      - "scripts/release/resolve-desktop-release-version.mjs"
      - "scripts/release/desktop-release-automation.test.mjs"
      - ".github/workflows/publish-desktop.yml"
      - "scripts/release/desktop-upgrade-inventory.py"
      - "scripts/verify/test-desktop-upgrade-inventory.py"
      - "scripts/release/verify-desktop-msi-upgrade.ps1"
      - "scripts/release/create-desktop-update-manifest.mjs"
      - "scripts/release/create-desktop-update-manifest.test.mjs"
      - "scripts/release/create-desktop-beta-manifest.mjs"
      - "scripts/release/create-desktop-beta-manifest.test.mjs"
      - "scripts/release/prepare-desktop-updater-config.mjs"
      - "scripts/release/prepare-desktop-updater-config.test.mjs"
      - "scripts/release/prepare-desktop-windows-sign-config.mjs"
      - "scripts/release/prepare-desktop-windows-sign-config.test.mjs"
      - "scripts/release/check-desktop-release-security.test.mjs"
      - ".github/workflows/release-desktop.yml"
      - ".github/workflows/publish-desktop-beta.yml"
      - ".github/workflows/auto-desktop-beta.yml"
      - "scripts/release/resolve-desktop-beta-version.mjs"
      - "scripts/release/resolve-desktop-beta-version.test.mjs"
      - "scripts/verify/test-desktop-workflow-yaml.py"
      - "apps/server/cmd/notespace/desktop_boundary.go"
      - "apps/server/cmd/notespace/desktop_boundary_test.go"
      - "scripts/dev/prepare-desktop-sidecar.mjs"
      - "scripts/assets/prepare-desktop-icons.mjs"
      - "scripts/assets/assert-desktop-icon.ps1"
      - "scripts/assets/desktop-icon-contract.test.mjs"
      - "apps/web/public/brand/notespace-fox-full.svg"
      - "scripts/verify/assert-windows-pe-subsystem.mjs"
      - "scripts/verify/assert-windows-pe-subsystem.test.mjs"
      - "scripts/verify/smoke-desktop-sidecar-lifecycle.mjs"
      - "scripts/verify/smoke-desktop-runtime.mjs"
      - "Taskfile.yml"
      - "bun.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check-desktop:
    # PR: policy checks only; master: full Linux Tauri build and smoke.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        if: github.event_name == 'push'
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify desktop upgrade inventory contract
        run: python scripts/verify/test-desktop-upgrade-inventory.py
      - name: Validate all GitHub Actions YAML before running expensive desktop builds
        if: runner.os == 'Linux'
        run: |
          python -m pip install --quiet "PyYAML==6.0.3"
          python scripts/verify/test-desktop-workflow-yaml.py

      - name: Syntax-check native WebDriver test
        run: node --check scripts/verify/desktop-webdriver-smoke.mjs
      - name: Verify desktop release automation policies and version selection
        run: |
          node --check scripts/release/resolve-desktop-release-version.mjs
          node --check scripts/release/assert-desktop-release-ci.mjs
          node --test scripts/release/desktop-release-automation.test.mjs
          node --check scripts/release/resolve-desktop-beta-version.mjs
          node --test scripts/release/resolve-desktop-beta-version.test.mjs
      - name: Verify WebView2 CI runner and release acceptance policy
        run: node --test scripts/verify/check-desktop-webdriver-policy.test.mjs scripts/verify/native-close-session.test.mjs scripts/verify/assert-windows-pe-subsystem.test.mjs
      - name: Verify signed updater manifest contract
        run: node --test scripts/release/create-desktop-update-manifest.test.mjs scripts/release/create-desktop-beta-manifest.test.mjs scripts/release/prepare-desktop-updater-config.test.mjs scripts/release/prepare-desktop-windows-sign-config.test.mjs scripts/release/check-desktop-release-security.test.mjs
      - name: Syntax-check updater release scripts
        run: |
          node --check scripts/release/create-desktop-update-manifest.mjs
          node --check scripts/release/prepare-desktop-updater-config.mjs
          node --check scripts/release/prepare-desktop-windows-sign-config.mjs
      - uses: dtolnay/rust-toolchain@stable
        if: github.event_name == 'push'
      - uses: Swatinem/rust-cache@v2
        if: github.event_name == 'push'
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          cache-bin: "false"
      - name: Install Tauri Linux dependencies
        if: github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: bun install --frozen-lockfile
        if: github.event_name == 'push'
      - run: bun run --filter @notespace/web build
        if: github.event_name == 'push'
      - run: bun run desktop:icons
        if: github.event_name == 'push'
      - run: node --test scripts/assets/desktop-icon-contract.test.mjs
        if: github.event_name == 'push'
      - run: node scripts/dev/prepare-desktop-sidecar.mjs
        if: github.event_name == 'push'
      - name: Smoke sidecar parent lifecycle
        if: github.event_name == 'push'
        run: bun run test:desktop:lifecycle
      - name: Smoke desktop sidecar runtime
        if: github.event_name == 'push'
        run: node scripts/verify/smoke-desktop-runtime.mjs
      - name: Test desktop runtime
        if: github.event_name == 'push'
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Build native executable
        if: github.event_name == 'push'
        working-directory: apps/desktop/src-tauri
        run: bunx @tauri-apps/cli@2.12.3 build --no-bundle -- --locked

  # WebView2 + EdgeDriver regression on Windows Server 2025:
  # https://github.com/actions/runner-images/issues/14738
  # Keep genuine native WebView2 acceptance on 2022; do NOT mark it skipped.
  check-desktop-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Deterministic YAML/release policy tests run once in the Linux job.
      # Keep only Windows-specific assertions and real native WebView2 here.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          shared-key: windows-2022-desktop
          save-if: ${{ github.ref == 'refs/heads/master' }}
          cache-bin: "false"
      - run: bun install --frozen-lockfile
      - run: bun run --filter @notespace/web build
      - run: bun run desktop:icons
      - run: node scripts/dev/prepare-desktop-sidecar.mjs
      - name: Verify Go Windows GUI subsystem (no console window)
        run: node scripts/verify/assert-windows-pe-subsystem.mjs apps/desktop/src-tauri/binaries/notespace-server-x86_64-pc-windows-msvc.exe
      - name: Parse MSI upgrade PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/release/verify-desktop-msi-upgrade.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Smoke sidecar parent lifecycle
        run: bun run test:desktop:lifecycle
      - name: Test desktop runtime
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Build debug executable for native parity
        working-directory: apps/desktop/src-tauri
        run: bunx @tauri-apps/cli@2.12.3 build --debug --no-bundle -- --locked
      - name: Validate branded icon in Windows EXE resource
        shell: pwsh
        run: ./scripts/assets/assert-desktop-icon.ps1 apps/desktop/src-tauri/target/debug/notespace-desktop.exe
      - name: Parse Windows native driver PowerShell helpers
        shell: pwsh
        run: |
          foreach ($script in @("scripts/dev/install-webview2-edgedriver.ps1", "scripts/dev/diagnose-desktop-webdriver.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Install Tauri WebDriver server
        run: cargo install tauri-driver --locked
      - name: Install Microsoft EdgeDriver matching WebView2 Runtime
        shell: pwsh
        run: ./scripts/dev/install-webview2-edgedriver.ps1
      - name: Diagnose native WebView2 and EdgeDriver
        shell: pwsh
        run: ./scripts/dev/diagnose-desktop-webdriver.ps1
      - name: Run critical native close and SQLite relaunch before MSI release
        env:
          TAURI_APP_BINARY: apps/desktop/src-tauri/target/debug/notespace-desktop.exe
          TAURI_NATIVE_PROFILE: ${{ runner.temp }}/pr-critical-webview
          NOTESPACE_DESKTOP_TEST_DATA_DIR: ${{ runner.temp }}/pr-critical-data
        run: bun run test:desktop:critical
      - name: Collect native WebDriver environment after failure
        if: failure()
        shell: pwsh
        run: ./scripts/dev/diagnose-desktop-webdriver.ps1


  # Separate current Windows image compile check: updates to the latest
  # toolchain must still be verified even while WebView2 automation is broken.
  check-desktop-windows-latest:
    # Keep current-image compatibility on each master commit, not every PR.
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
          cache-bin: "false"
      - run: bun install --frozen-lockfile
      - run: bun run --filter @notespace/web build
      - run: bun run desktop:icons
      - run: node scripts/dev/prepare-desktop-sidecar.mjs
      - name: Verify Go Windows GUI subsystem (no console window)
        run: node scripts/verify/assert-windows-pe-subsystem.mjs apps/desktop/src-tauri/binaries/notespace-server-x86_64-pc-windows-msvc.exe
      - name: Native Rust tests on current Windows
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Build desktop on current Windows
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked
      - name: Validate Windows EXE icon resource
        shell: pwsh
        run: ./scripts/assets/assert-desktop-icon.ps1 apps/desktop/src-tauri/target/debug/notespace-desktop.exe
