<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notespace</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #252630; background: #f7f8fa; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { display: grid; gap: 8px; text-align: center; }
      h1 { margin: 0; font-size: 18px; font-weight: 600; }
      p { margin: 0; color: #787b8a; font-size: 13px; }
      [data-error="true"] { color: #b13e4b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Notespace</h1>
      <p id="status">Starting local workspace…</p>
    </main>
  </body>
</html>
