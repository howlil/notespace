name: Publish Desktop Stable

# Reusable version-allocation and immutable-tag stage called only by release.yml.
# Production releases remain opt-in: never publish on every master commit.
# Concurrency is owned by the caller (release.yml: notespace-release-desktop) across
# allocate -> build -> publish to prevent competing releases or parent/child deadlocks.
on:
  workflow_call:
    inputs:
      bump:
        type: string
        default: patch
      version:
        type: string
        default: ""
    outputs:
      release_tag:
        value: ${{ jobs.prepare-and-dispatch.outputs.release_tag }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false

permissions:
  contents: write
  actions: read

jobs:
  prepare-and-dispatch:
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Require current master branch and immutable release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Start Publish Desktop from master, never a feature branch or tag."
            exit 1
          fi
          remote_master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$remote_master" != "$GITHUB_SHA" ]]; then
            echo "::error::master moved after workflow start. Re-run on the new HEAD."
            exit 1
          fi

      - name: Require successful master push ci and exact-attempt ci / gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/assert-desktop-release-ci.mjs --collect "$GITHUB_SHA" --target desktop

      - name: Require production updater and optional Windows publisher signing configuration
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          NOTESPACE_UPDATER_PUBLIC_KEY: ${{ vars.NOTESPACE_UPDATER_PUBLIC_KEY }}
          NOTESPACE_AZURE_SIGNING_ENDPOINT: ${{ vars.NOTESPACE_AZURE_SIGNING_ENDPOINT }}
          NOTESPACE_AZURE_SIGNING_ACCOUNT: ${{ vars.NOTESPACE_AZURE_SIGNING_ACCOUNT }}
          NOTESPACE_AZURE_SIGNING_PROFILE: ${{ vars.NOTESPACE_AZURE_SIGNING_PROFILE }}
          NOTESPACE_WINDOWS_SIGNER_SUBJECT: ${{ vars.NOTESPACE_WINDOWS_SIGNER_SUBJECT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          missing_updater=0
          for key in TAURI_SIGNING_PRIVATE_KEY NOTESPACE_UPDATER_PUBLIC_KEY; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error title=Updater signing is not configured::Set Actions secret/variable $key before publishing."
              missing_updater=1
            fi
          done
          if [[ "$missing_updater" -ne 0 ]]; then
            echo "See docs/DESKTOP_FIRST_RELEASE.md; no tag was created."
            exit 1
          fi
          azure_keys=(
            NOTESPACE_AZURE_SIGNING_ENDPOINT
            NOTESPACE_AZURE_SIGNING_ACCOUNT
            NOTESPACE_AZURE_SIGNING_PROFILE
            NOTESPACE_WINDOWS_SIGNER_SUBJECT
            AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET
            AZURE_TENANT_ID
          )
          azure_present=0
          azure_missing=()
          for key in "${azure_keys[@]}"; do
            if [[ -n "${!key:-}" ]]; then
              azure_present=$((azure_present + 1))
            else
              azure_missing+=("$key")
            fi
          done
          if [[ "$azure_present" -gt 0 && "$azure_present" -lt "${#azure_keys[@]}" ]]; then
            for key in "${azure_missing[@]}"; do
              echo "::error title=Incomplete Windows Authenticode signing configuration::Set $key or clear all Azure signing settings."
            done
            echo "See docs/DESKTOP_FIRST_RELEASE.md; no tag was created."
            exit 1
          fi
          if [[ "$azure_present" -eq "${#azure_keys[@]}" ]]; then
            echo "Updater signing and Windows Authenticode publisher signing are configured."
          else
            echo "::notice::Publishing stable release with Tauri updater signing only (no Windows Authenticode publisher certificate configured)."
          fi

      - name: Choose next stable release version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/desktop-releases.json"
          git ls-remote --tags --refs origin | awk '{sub(/^refs\\/tags\\//, "", $2); print $2}' > "$RUNNER_TEMP/desktop-tags.txt"
          tag=$(node scripts/release/resolve-desktop-release-version.mjs "$BUMP" "$VERSION_OVERRIDE" "$RUNNER_TEMP/desktop-tags.txt" < "$RUNNER_TEMP/desktop-releases.json")
          if [[ -n "$(git ls-remote --tags --refs origin "refs/tags/$tag")" ]]; then
            echo "::error::Tag $tag already exists. No tag was created; use a newer version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Selected stable desktop version: $tag"

      - name: Create immutable annotated version tag on verified master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          remote_master=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$remote_master" != "$GITHUB_SHA" ]]; then
            echo "::error::master advanced while preparing release; no tag was created."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Notespace Desktop $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          echo "Created $RELEASE_TAG at $GITHUB_SHA"
