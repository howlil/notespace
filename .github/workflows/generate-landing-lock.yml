name: Generate landing lockfile

on:
  push:
    branches:
      - chore/generate-landing-lock

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: landing/package.json
      - name: Generate standalone landing lockfile
        working-directory: landing
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-workspace
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing/pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(landing): add pnpm lockfile"
          git push origin HEAD:chore/generate-landing-lock
