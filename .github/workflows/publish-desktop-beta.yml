name: Publish Desktop Beta (free)

# Public, explicitly unsigned MSI beta. No Azure account, publisher certificate,
# Tauri updater key, or paid service is required to run this workflow.
# No automatic installer updater is enabled for beta builds.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: notespace-desktop-release-init
  cancel-in-progress: false

jobs:
  windows-msi-beta:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: corepack enable

      - name: Verify current master and passing master CI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/master') {
            throw "Run free desktop beta only from master"
          }
          $master = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $master -ne $env:GITHUB_SHA) {
            throw "master advanced; retry on its latest verified commit"
          }
          $checks = Join-Path $env:RUNNER_TEMP 'notespace-beta-master-ci.json'
          gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA&event=push&per_page=100" | Out-File -FilePath $checks -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Could not retrieve master CI" }
          node scripts/assert-desktop-release-ci.mjs $checks $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Master CI gate failed" }

      - name: Select next public unsigned beta version
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releases = Join-Path $env:RUNNER_TEMP 'notespace-beta-releases.json'
          gh release list --limit 100 --json tagName,isDraft,isPrerelease | Out-File -FilePath $releases -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Could not list published versions" }
          $tag = (Get-Content -Raw $releases | node scripts/resolve-desktop-beta-version.mjs).Trim()
          if ($LASTEXITCODE -ne 0 -or $tag -notmatch '^v0\.1\.0-beta\.[1-9][0-9]*$') {
            throw "Failed to select a valid unsigned beta tag"
          }
          $existingTag = @(git ls-remote --tags --refs origin "refs/tags/$tag")
          if ($LASTEXITCODE -ne 0) { throw "Could not check GitHub tag collision" }
          if ($existingTag.Count -gt 0) {
            throw "Tag $tag already exists. Do not overwrite immutable tags."
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          Write-Host "Selected unsigned beta $tag"

      - name: Synchronize desktop beta version
        shell: pwsh
        env:
          NOTESPACE_DESKTOP_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/sync-desktop-version.mjs

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/prepare-desktop-sidecar.mjs
      - name: Test sidecar shutdown and runtime lifecycle
        run: pnpm test:desktop:lifecycle
      - name: Test Rust desktop supervisor
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Build unsigned Windows MSI (updater disabled)
        working-directory: apps/desktop/src-tauri
        shell: pwsh
        env:
          BETA_VERSION: ${{ steps.release.outputs.version }}
        run: |
          # No Azure credentials, signCommand, updater overlay or private key.
          if ($env:NOTESPACE_UPDATER_ENABLED -eq '1' -or $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "Unsigned beta must never reuse production updater signing inputs"
          }
          $match = [regex]::Match($env:BETA_VERSION, '^0\.1\.0-beta\.([1-9][0-9]*)$')
          if (-not $match.Success) { throw "Invalid desktop beta version" }
          $sequence = [long]::Parse($match.Groups[1].Value)
          if ($sequence -gt 65535) { throw "MSI numeric patch version exceeds WiX limit" }
          # WiX ProductVersion must rise for each new MSI. App SemVer is
          # 0.1.0-beta.N, while Windows MSI is numeric 0.1.N.
          $overlay = Join-Path $env:RUNNER_TEMP 'notespace-free-beta-wix.json'
          @{ bundle = @{ windows = @{ wix = @{ version = "0.1.$sequence" } } } } |
            ConvertTo-Json -Depth 10 | Set-Content -Path $overlay
          cargo tauri build --config $overlay -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri MSI build failed" }

      - name: Install real native Tauri WebView2 test tooling
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Tauri WebDriver" }
          ./scripts/install-webview2-edgedriver.ps1
          ./scripts/diagnose-desktop-webdriver.ps1

      - name: Exercise actual desktop launch/relaunch
        env:
          TAURI_APP_BINARY: apps/desktop/src-tauri/target/release/notespace-desktop.exe
          TAURI_NATIVE_PROFILE: ${{ runner.temp }}/beta-webview
          NOTESPACE_DESKTOP_TEST_DATA_DIR: ${{ runner.temp }}/beta-data
        run: pnpm test:desktop:native

      - name: Prove authored data survives close and restart
        env:
          TAURI_APP_BINARY: apps/desktop/src-tauri/target/release/notespace-desktop.exe
          TAURI_NATIVE_PROFILE: ${{ runner.temp }}/beta-critical-webview
          NOTESPACE_DESKTOP_TEST_DATA_DIR: ${{ runner.temp }}/beta-critical-data
        run: pnpm test:desktop:critical

      - name: Assert one unsigned MSI and generate SHA-256 checksum
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'apps/desktop/src-tauri/target/release/bundle'
          $msis = @(Get-ChildItem -Path $bundle -Recurse -File -Filter '*.msi')
          if ($msis.Count -ne 1) { throw "Expected precisely one unsigned MSI" }
          $signature = Get-AuthenticodeSignature -FilePath $msis[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Free beta unexpectedly carries an Authenticode signature; check build policy"
          }
          $hash = (Get-FileHash -LiteralPath $msis[0].FullName -Algorithm SHA256).Hash
          "$hash  $($msis[0].Name)" | Set-Content -Path (Join-Path $bundle 'SHA256SUMS.txt')
          "path=$($msis[0].FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msis[0].Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Unsigned beta MSI verified, SHA-256: $hash"

      - name: Attest unsigned MSI provenance
        uses: actions/attest@v4
        with:
          subject-path: apps/desktop/src-tauri/target/release/bundle/**/*.msi

      - name: Verify provenance before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MSI_PATH: ${{ steps.installer.outputs.path }}
        run: |
          gh attestation verify "$env:MSI_PATH" -R "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "Unsigned beta provenance verification failed" }

      - name: Upload beta MSI for build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: notespace-beta-${{ steps.release.outputs.tag }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create beta tag and publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          MSI_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Never tag a commit after master advanced or bypass changed CI.
          $master = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $master -ne $env:GITHUB_SHA) {
            throw "master moved while MSI was building. Refuse publishing stale beta."
          }
          $existingTag = @(git ls-remote --tags --refs origin "refs/tags/$env:TAG")
          if ($LASTEXITCODE -ne 0) { throw "Cannot verify remote tag before publishing" }
          if ($existingTag.Count -gt 0) { throw "Refusing to overwrite existing Git tag or GitHub Release" }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$env:TAG" "$env:GITHUB_SHA" -m "Notespace Desktop unsigned beta $env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not create beta tag" }
          git push origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not publish beta tag" }

          $sum = 'apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt'
          $notes = @'
          UNSIGNED WINDOWS BETA — community testing only.

          No Azure, paid certificate, or Tauri updater signing key is required.
          This MSI is not Authenticode signed. Windows SmartScreen may warn or
          block installation. Download ONLY from this official GitHub Release.
          Automatic updates are disabled in this beta; install later versions manually.

          The installer passed native desktop startup/relaunch, persistence,
          and GitHub build provenance checks. Verify SHA256SUMS.txt if desired.
          '@
          gh release create "$env:TAG" "$env:MSI_PATH" "$sum" --verify-tag --prerelease --title "Notespace Desktop $env:TAG (unsigned beta)" --notes $notes --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Could not publish unsigned beta GitHub Release" }
          "Published beta: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG" >> $env:GITHUB_STEP_SUMMARY
)
          if (-not $match.Success) { throw "Invalid desktop beta version" }
          $sequence = [long]::Parse($match.Groups[1].Value)
          if ($sequence -gt 65535) { throw "MSI numeric patch version exceeds WiX limit" }
          # WiX ProductVersion needs a rising numeric version for each new MSI.
          # App SemVer stays 0.1.0-beta.N, while MSI uses 0.1.N.
          $overlay = Join-Path $env:RUNNER_TEMP 'notespace-free-beta-wix.json'
          @{ bundle = @{ windows = @{ wix = @{ version = "0.1.$sequence" } } } } |
            ConvertTo-Json -Depth 10 | Set-Content -Path $overlay
          cargo tauri build --config $overlay -- --locked
          if ($LASTEXITCODE -ne 0) { throw "Tauri MSI build failed" }

      - name: Install real native Tauri WebView2 test tooling
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          if ($LASTEXITCODE -ne 0) { throw "Failed to install Tauri WebDriver" }
          ./scripts/install-webview2-edgedriver.ps1
          ./scripts/diagnose-desktop-webdriver.ps1

      - name: Exercise actual desktop launch/relaunch
        env:
          TAURI_APP_BINARY: apps/desktop/src-tauri/target/release/notespace-desktop.exe
          TAURI_NATIVE_PROFILE: ${{ runner.temp }}/beta-webview
          NOTESPACE_DESKTOP_TEST_DATA_DIR: ${{ runner.temp }}/beta-data
        run: pnpm test:desktop:native

      - name: Prove authored data survives close and restart
        env:
          TAURI_APP_BINARY: apps/desktop/src-tauri/target/release/notespace-desktop.exe
          TAURI_NATIVE_PROFILE: ${{ runner.temp }}/beta-critical-webview
          NOTESPACE_DESKTOP_TEST_DATA_DIR: ${{ runner.temp }}/beta-critical-data
        run: pnpm test:desktop:critical

      - name: Assert one unsigned MSI and generate SHA-256 checksum
        id: installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundle = 'apps/desktop/src-tauri/target/release/bundle'
          $msis = @(Get-ChildItem -Path $bundle -Recurse -File -Filter '*.msi')
          if ($msis.Count -ne 1) { throw "Expected precisely one unsigned MSI" }
          $signature = Get-AuthenticodeSignature -FilePath $msis[0].FullName
          if ($signature.Status -ne 'NotSigned') {
            throw "Free beta unexpectedly carries an Authenticode signature; check build policy"
          }
          $hash = (Get-FileHash -LiteralPath $msis[0].FullName -Algorithm SHA256).Hash
          "$hash  $($msis[0].Name)" | Set-Content -Path (Join-Path $bundle 'SHA256SUMS.txt')
          "path=$($msis[0].FullName)" >> $env:GITHUB_OUTPUT
          "name=$($msis[0].Name)" >> $env:GITHUB_OUTPUT
          Write-Host "Unsigned beta MSI verified, SHA-256: $hash"

      - name: Attest unsigned MSI provenance
        uses: actions/attest@v4
        with:
          subject-path: apps/desktop/src-tauri/target/release/bundle/**/*.msi

      - name: Verify provenance before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          MSI_PATH: ${{ steps.installer.outputs.path }}
        run: |
          gh attestation verify "$env:MSI_PATH" -R "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "Unsigned beta provenance verification failed" }

      - name: Upload beta MSI for build diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: notespace-beta-${{ steps.release.outputs.tag }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create beta tag and publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          MSI_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Never tag a commit after master advanced or bypass changed CI.
          $master = (gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $master -ne $env:GITHUB_SHA) {
            throw "master moved while MSI was building. Refuse publishing stale beta."
          }
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to overwrite existing GitHub Release" }
          git ls-remote --exit-code --tags --refs origin "refs/tags/$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Refusing to overwrite existing Git tag" }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$env:TAG" "$env:GITHUB_SHA" -m "Notespace Desktop unsigned beta $env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not create beta tag" }
          git push origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not publish beta tag" }

          $sum = 'apps/desktop/src-tauri/target/release/bundle/SHA256SUMS.txt'
          $notes = @'
          UNSIGNED WINDOWS BETA — community testing only.

          No Azure, paid certificate, or Tauri updater signing key is required.
          This MSI is not Authenticode signed. Windows SmartScreen may warn or
          block installation. Download ONLY from this official GitHub Release.
          Automatic updates are disabled in this beta; install later versions manually.

