services:
  notespace:
    build: .
    ports:
      - "${NOTESPACE_BIND_IP:-127.0.0.1}:${NOTESPACE_PORT:-8080}:8080"
    volumes:
      - notespace-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  notespace-data:
