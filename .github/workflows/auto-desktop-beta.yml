name: Desktop release preflight (manual)

# Retained for read-only acceptance until #200 M5b publication/retirement gates.
# No workflow_run, push, tag, release creation or publisher dispatch.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: notespace-desktop-release-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify current master without publishing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Run release preflight from master."
            exit 1
          fi
          node scripts/release/assert-desktop-release-ci.mjs --collect "$GITHUB_SHA"
          echo "Read-only preflight passed; no publisher was dispatched." >> "$GITHUB_STEP_SUMMARY"
