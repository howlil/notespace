name: Format M11 Go files

on:
  push:
    branches:
      - feat/m11-constraint-remediation
    paths:
      - .github/workflows/gofmt-m11.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m11-constraint-remediation
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
      - name: Format and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            apps/server/internal/httpapi/api.go \
            apps/server/internal/persistence/assets_search_test.go \
            apps/server/internal/persistence/search_index.go
          git rm .github/workflows/gofmt-m11.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/internal/httpapi/api.go apps/server/internal/persistence/assets_search_test.go apps/server/internal/persistence/search_index.go
          git commit -m "style(server): gofmt M11 changes"
          git push origin HEAD:feat/m11-constraint-remediation
