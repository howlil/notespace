name: Align final M11 export test

on:
  push:
    branches:
      - feat/m11-constraint-remediation
    paths:
      - .github/workflows/m11-final-test-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m11-constraint-remediation
      - name: Remove legacy relationships export assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/server/internal/httpapi/api_test.go')
          s = p.read_text()
          old = ', "relationships.json": false'
          if old not in s:
              raise SystemExit('legacy relationships assertion not found')
          p.write_text(s.replace(old, '', 1))
          PY
          rm .github/workflows/m11-final-test-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/server/internal/httpapi/api_test.go .github/workflows/m11-final-test-fix.yml
          git commit -m 'test(server): remove legacy relationships export expectation'
          git push origin HEAD:feat/m11-constraint-remediation
