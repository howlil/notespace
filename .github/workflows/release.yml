name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Explicit destination; preflight performs no publication or deployment"
        type: choice
        required: true
        default: preflight
        options: [preflight, desktop-stable, desktop-stable-resume, image]
      version:
        description: "Stable desktop override, existing unpublished tag for desktop-stable-resume, or existing stable image tag"
        type: string
        required: false
        default: ""
      bump:
        description: "Desktop stable increment only (ignored when stable version is supplied)"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: read
  actions: read

concurrency:
  group: notespace-release-${{ startsWith(inputs.mode, 'desktop-') && 'desktop' || inputs.mode }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.request.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Validate explicit release request
        id: request
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: node scripts/release/release-request.mjs
      - name: Require current master push CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ steps.request.outputs.mode }}
        run: |
          set -euo pipefail
          case "$RELEASE_MODE" in
            desktop-stable|desktop-stable-resume) TARGET="desktop" ;;
            image) TARGET="image" ;;
            *) TARGET="gate" ;;
          esac
          node scripts/release/assert-desktop-release-ci.mjs --collect "$GITHUB_SHA" --target "$TARGET"

  stable-prepare:
    needs: preflight
    if: needs.preflight.outputs.mode == 'desktop-stable'
    uses: ./.github/workflows/publish-desktop.yml
    with:
      bump: ${{ inputs.bump }}
      version: ${{ inputs.version }}
    permissions:
      contents: write
      actions: read
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  stable:
    needs: [preflight, stable-prepare]
    if: needs.preflight.outputs.mode == 'desktop-stable'
    uses: ./.github/workflows/release-desktop.yml
    with:
      release_tag: ${{ needs.stable-prepare.outputs.release_tag }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  stable-resume:
    needs: preflight
    if: needs.preflight.outputs.mode == 'desktop-stable-resume'
    uses: ./.github/workflows/release-desktop.yml
    with:
      release_tag: ${{ inputs.version }}
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  image:
    needs: preflight
    if: needs.preflight.outputs.mode == 'image'
    permissions:
      contents: read
      actions: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Require verified master and explicit stable image version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Publish images from verified master, never a desktop tag."
            exit 1
          fi
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ -n "$IMAGE_VERSION" && ! "$IMAGE_VERSION" =~ $stable ]]; then
            echo "::error::Image version must be stable vMAJOR.MINOR.PATCH; beta tags cannot update latest."
            exit 1
          fi
          node scripts/release/assert-desktop-release-ci.mjs --collect "$GITHUB_SHA" --target image
      - name: Bind image version to immutable source tag
        if: inputs.version != ''
        shell: bash
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$IMAGE_VERSION:refs/tags/$IMAGE_VERSION"
          candidate=$(git rev-parse "refs/tags/$IMAGE_VERSION^{commit}")
          if [[ "$candidate" != "$GITHUB_SHA" ]]; then
            echo "::error::Image version tag must point at this verified master SHA; never reuse a version for different source."
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/notespace
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=sha
      - name: Build candidate image once
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: notespace:release-candidate
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify loaded candidate image with Compose persistence smoke
        shell: bash
        run: |
          set -euo pipefail
          OVERRIDE="$RUNNER_TEMP/compose.release-candidate.yaml"
          cat <<'EOF' > "$OVERRIDE"
          services:
            notespace:
              image: notespace:release-candidate
              ports:
                - "127.0.0.1:8080:8080"
          EOF
          export COMPOSE_FILE="compose.yaml:$OVERRIDE"
          docker compose config >/dev/null
          docker compose up --no-build -d --wait
          python3 scripts/verify/smoke-persistence.py --compose-restart
      - name: Collect Compose logs and tear down candidate container
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          OVERRIDE="$RUNNER_TEMP/compose.release-candidate.yaml"
          if [[ -f "$OVERRIDE" ]]; then
            export COMPOSE_FILE="compose.yaml:$OVERRIDE"
            docker compose logs || true
            docker compose down -v
          fi
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified candidate image digest and tags
        shell: bash
        env:
          METADATA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          candidate_id="$(docker image inspect --format '{{.Id}}' notespace:release-candidate)"
          mapfile -t all_tags < <(printf '%s\n' "$METADATA_TAGS" | awk 'NF')
          immutable_tags=()
          latest_tag=""
          for tag in "${all_tags[@]}"; do
            if [[ "$tag" == *:latest ]]; then
              latest_tag="$tag"
            else
              immutable_tags+=("$tag")
            fi
          done
          if [[ "${#immutable_tags[@]}" -eq 0 ]]; then
            echo "::error::Expected at least one immutable tag for candidate promotion"
            exit 1
          fi
          first_tag="${immutable_tags[0]}"
          docker tag notespace:release-candidate "$first_tag"
          docker push "$first_tag"
          digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$first_tag")"
          if [[ ! "$digest_ref" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Failed to resolve pushed candidate digest from $first_tag ($digest_ref)"
            exit 1
          fi
          if [[ "$(docker image inspect --format '{{.Id}}' notespace:release-candidate)" != "$candidate_id" ]]; then
            echo "::error::Candidate image mutated during promotion"
            exit 1
          fi
          for tag in "${immutable_tags[@]:1}"; do
            docker buildx imagetools create --tag "$tag" "$digest_ref"
          done
          if [[ -n "$latest_tag" ]]; then
            docker buildx imagetools create --tag "$latest_tag" "$digest_ref"
          fi
          echo "Promoted verified candidate digest $digest_ref"
