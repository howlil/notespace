name: Deploy notespace to Cloudflare (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-notespace-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Require Cloudflare credentials
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$CF_ACCOUNT_ID" || -z "$CF_API_TOKEN" ]]; then
            echo '::error::Configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in GitHub Actions repository secrets.'
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact-master CI before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/assert-desktop-release-ci.mjs --collect "$GITHUB_SHA"
      - run: bun install --frozen-lockfile
        working-directory: landing
      - run: bun run build
        working-directory: landing
      - name: Deploy existing notespace Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name notespace --config wrangler.jsonc
