          and GitHub build provenance checks. Verify SHA256SUMS.txt if desired.
          '@
          gh release create "$env:TAG" "$env:MSI_PATH" "$sum" --verify-tag --prerelease --title "Notespace Desktop $env:TAG (unsigned beta)" --notes $notes --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Could not publish unsigned beta GitHub Release" }
          "Published beta: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG" >> $env:GITHUB_STEP_SUMMARY
