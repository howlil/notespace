services:
  notespace:
    build: .
    environment:
      NOTESPACE_BIND_IP: "${NOTESPACE_BIND_IP:-0.0.0.0}"
      NOTESPACE_PORT: "${NOTESPACE_PORT:-8080}"
      NOTESPACE_ADDR: "${NOTESPACE_BIND_IP:-0.0.0.0}:${NOTESPACE_PORT:-8080}"
    expose:
      - "8080"
    volumes:
      - notespace-data:/data
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  notespace-data:
