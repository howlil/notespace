name: Probe deployed assets
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe CSS hashes
        run: |
          nonce="$(date +%s%N)"
          curl -sS -o /dev/null -w 'HTML_CSS code=%{http_code} type=%{content_type}\n' "https://notespace.howlil.my.id/assets/styles-CKBgMKgn.css?probe=${nonce}"
          curl -sS -o /dev/null -w 'CI_CSS code=%{http_code} type=%{content_type}\n' "https://notespace.howlil.my.id/assets/styles-C4q8ZjuK.css?probe=${nonce}"
