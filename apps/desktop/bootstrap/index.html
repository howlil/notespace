<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notespace</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #252630; background: #f5f5f2; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { display: grid; gap: 8px; text-align: center; }
      h1 { margin: 0; font-size: 18px; font-weight: 600; }
      p { margin: 0; color: #787b8a; font-size: 13px; }
      [data-error="true"] { color: #b13e4b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Notespace</h1>
      <p id="status">Starting local workspace…</p>
    </main>
    <script>
      (() => {
        if (!window.location.hash.startsWith("#recovery=")) return;
        let message = "Local runtime stopped.";
        try {
          message = decodeURIComponent(window.location.hash.slice("#recovery=".length));
        } catch {}
        document.title = "Notespace — Recovery";
        document.body.innerHTML = '<main style="max-width:560px;margin:8vh auto;padding:24px;font-family:system-ui,sans-serif;line-height:1.5;text-align:left"><h1>Notespace recovery</h1><p id="recovery-message" style="color:#9f3342;white-space:pre-wrap"></p><p>Notespace does not automatically replace your database. Unsaved changes may be lost; if the database is damaged, use a verified backup. Retrying does not restore data.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="recovery-retry">Retry startup</button><button id="recovery-points-button">Show recovery points</button><button id="recovery-diagnostics-button">Show diagnostics</button></div><pre id="recovery-details" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:50vh;overflow:auto"></pre></main>';
        document.getElementById("recovery-message").textContent = message;
        const details = document.getElementById("recovery-details");
        const invoke = (command) => window.__TAURI_INTERNALS__.invoke(command);
        document.getElementById("recovery-retry").onclick = async () => {
          details.textContent = "Starting Notespace…";
          try { await invoke("desktop_retry_runtime"); }
          catch (e) { details.textContent = String(e); }
        };
        document.getElementById("recovery-points-button").onclick = async () => {
          try {
            const points = await invoke("list_desktop_recovery_points");
            details.textContent = points.length
              ? "Recovery points (read-only; manual offline restore only):\n" + points.map((p) => p.name + " (" + p.bytes + " bytes)\n" + p.path).join("\n")
              : "No pre-migration recovery snapshots found.";
          } catch (e) { details.textContent = String(e); }
        };
        document.getElementById("recovery-diagnostics-button").onclick = async () => {
          try { details.textContent = JSON.stringify(await invoke("desktop_recovery_diagnostics"), null, 2); }
          catch (e) { details.textContent = String(e); }
        };
        document.querySelectorAll("#recovery-retry,#recovery-points-button,#recovery-diagnostics-button").forEach((b) => {
          b.style.cssText = "padding:8px 14px;border:1px solid #aaa;border-radius:20px;background:white;color:#252630;cursor:pointer";
        });
      })();
    </script>
  </body>
</html>
