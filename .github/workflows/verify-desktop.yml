name: Verify Desktop

on:
  pull_request:
    paths:
      - ".agents/engineering.md"
      - "apps/desktop/**"
      - "apps/server/cmd/notespace/**"
      - "apps/server/internal/sqlite/**"
      - "apps/server/migrations/**"
      - "apps/web/**"
      - "package.json"
      - "scripts/desktop-webdriver-smoke.mjs"
      - "scripts/diagnose-desktop-webdriver.ps1"
      - "scripts/install-webview2-edgedriver.ps1"
      - "scripts/check-desktop-webdriver-policy.test.mjs"
      - "scripts/assert-desktop-release-ci.mjs"
      - "scripts/resolve-desktop-release-version.mjs"
      - "scripts/desktop-release-automation.test.mjs"
      - ".github/workflows/publish-desktop.yml"
      - "scripts/desktop-upgrade-inventory.py"
      - "scripts/test-desktop-upgrade-inventory.py"
      - "scripts/verify-desktop-msi-upgrade.ps1"
      - "scripts/create-desktop-update-manifest.mjs"
      - "scripts/create-desktop-update-manifest.test.mjs"
      - "scripts/prepare-desktop-updater-config.mjs"
      - "scripts/prepare-desktop-updater-config.test.mjs"
      - "scripts/prepare-desktop-windows-sign-config.mjs"
      - "scripts/prepare-desktop-windows-sign-config.test.mjs"
      - "scripts/check-desktop-release-security.test.mjs"
      - ".github/workflows/release-desktop.yml"
      - "apps/server/cmd/notespace/desktop_boundary.go"
      - "apps/server/cmd/notespace/desktop_boundary_test.go"
      - "scripts/prepare-desktop-sidecar.mjs"
      - "scripts/smoke-desktop-sidecar-lifecycle.mjs"
      - "scripts/smoke-desktop-runtime.mjs"
      - "Taskfile.yml"
      - "pnpm-lock.yaml"
  push:
    branches: [master]
    paths:
      - "apps/desktop/**"
      - "apps/server/cmd/notespace/**"
      - "apps/server/internal/sqlite/**"
      - "apps/server/migrations/**"
      - "apps/web/**"
      - "package.json"
      - "scripts/desktop-webdriver-smoke.mjs"
      - "scripts/diagnose-desktop-webdriver.ps1"
      - "scripts/install-webview2-edgedriver.ps1"
      - "scripts/check-desktop-webdriver-policy.test.mjs"
      - "scripts/assert-desktop-release-ci.mjs"
      - "scripts/resolve-desktop-release-version.mjs"
      - "scripts/desktop-release-automation.test.mjs"
      - ".github/workflows/publish-desktop.yml"
      - "scripts/desktop-upgrade-inventory.py"
      - "scripts/test-desktop-upgrade-inventory.py"
      - "scripts/verify-desktop-msi-upgrade.ps1"
      - "scripts/create-desktop-update-manifest.mjs"
      - "scripts/create-desktop-update-manifest.test.mjs"
      - "scripts/prepare-desktop-updater-config.mjs"
      - "scripts/prepare-desktop-updater-config.test.mjs"
      - "scripts/prepare-desktop-windows-sign-config.mjs"
      - "scripts/prepare-desktop-windows-sign-config.test.mjs"
      - "scripts/check-desktop-release-security.test.mjs"
      - ".github/workflows/release-desktop.yml"
      - "apps/server/cmd/notespace/desktop_boundary.go"
      - "apps/server/cmd/notespace/desktop_boundary_test.go"
      - "scripts/prepare-desktop-sidecar.mjs"
      - "scripts/smoke-desktop-sidecar-lifecycle.mjs"
      - "scripts/smoke-desktop-runtime.mjs"
      - "Taskfile.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  check-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify desktop upgrade inventory contract
        run: python scripts/test-desktop-upgrade-inventory.py
      - name: Syntax-check native WebDriver test
        run: node --check scripts/desktop-webdriver-smoke.mjs
      - name: Verify desktop release automation policies and version selection
        run: |
          node --check scripts/resolve-desktop-release-version.mjs
          node --check scripts/assert-desktop-release-ci.mjs
          node --test scripts/desktop-release-automation.test.mjs
      - name: Verify WebView2 CI runner and release acceptance policy
        run: node --test scripts/check-desktop-webdriver-policy.test.mjs
      - name: Verify signed updater manifest contract
        run: node --test scripts/create-desktop-update-manifest.test.mjs scripts/prepare-desktop-updater-config.test.mjs scripts/prepare-desktop-windows-sign-config.test.mjs scripts/check-desktop-release-security.test.mjs
      - name: Syntax-check updater release scripts
        run: |
          node --check scripts/create-desktop-update-manifest.mjs
          node --check scripts/prepare-desktop-updater-config.mjs
          node --check scripts/prepare-desktop-windows-sign-config.mjs
      - run: rustup update stable && rustup default stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/prepare-desktop-sidecar.mjs
      - name: Validate MSI upgrade PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/verify-desktop-msi-upgrade.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Smoke sidecar parent lifecycle
        run: pnpm test:desktop:lifecycle
      - name: Smoke desktop sidecar runtime
        run: node scripts/smoke-desktop-runtime.mjs
      - name: Test desktop runtime
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Build native executable
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --no-bundle -- --locked

  # WebView2 + EdgeDriver regression on Windows Server 2025:
  # https://github.com/actions/runner-images/issues/14738
  # Keep genuine native WebView2 acceptance on 2022; do NOT mark it skipped.
  check-desktop-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify desktop upgrade inventory contract
        run: python scripts/test-desktop-upgrade-inventory.py
      - name: Syntax-check native WebDriver test
        run: node --check scripts/desktop-webdriver-smoke.mjs
      - name: Verify desktop release automation policies and version selection
        run: |
          node --check scripts/resolve-desktop-release-version.mjs
          node --check scripts/assert-desktop-release-ci.mjs
          node --test scripts/desktop-release-automation.test.mjs
      - name: Verify WebView2 CI runner and release acceptance policy
        run: node --test scripts/check-desktop-webdriver-policy.test.mjs
      - name: Verify signed updater manifest contract
        run: node --test scripts/create-desktop-update-manifest.test.mjs scripts/prepare-desktop-updater-config.test.mjs scripts/prepare-desktop-windows-sign-config.test.mjs scripts/check-desktop-release-security.test.mjs
      - name: Syntax-check updater release scripts
        run: |
          node --check scripts/create-desktop-update-manifest.mjs
          node --check scripts/prepare-desktop-updater-config.mjs
          node --check scripts/prepare-desktop-windows-sign-config.mjs
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/prepare-desktop-sidecar.mjs
      - name: Parse MSI upgrade PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/verify-desktop-msi-upgrade.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Smoke sidecar parent lifecycle
        run: pnpm test:desktop:lifecycle
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Test desktop runtime
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Build native executable
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --no-bundle -- --locked
      - name: Build debug executable for native parity
        working-directory: apps/desktop/src-tauri
        run: cargo tauri build --debug --no-bundle -- --locked
      - name: Parse Windows native driver PowerShell helpers
        shell: pwsh
        run: |
          foreach ($script in @("scripts/install-webview2-edgedriver.ps1", "scripts/diagnose-desktop-webdriver.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Install Tauri WebDriver server
        run: cargo install tauri-driver --locked
      - name: Install Microsoft EdgeDriver matching WebView2 Runtime
        shell: pwsh
        run: ./scripts/install-webview2-edgedriver.ps1
      - name: Diagnose native WebView2 and EdgeDriver
        shell: pwsh
        run: ./scripts/diagnose-desktop-webdriver.ps1
      - name: Run native WebDriver parity smoke
        run: pnpm test:desktop:native
      - name: Collect native WebDriver environment after failure
        if: failure()
        shell: pwsh
        run: ./scripts/diagnose-desktop-webdriver.ps1


  # Separate current Windows image compile check: updates to the latest
  # toolchain must still be verified even while WebView2 automation is broken.
  check-desktop-windows-latest:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/prepare-desktop-sidecar.mjs
      - name: Native Rust tests on current Windows
        working-directory: apps/desktop/src-tauri
        run: cargo test --locked
      - name: Build desktop on current Windows
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked
