name: Refresh Eraser layout lock
on:
  push:
    paths:
      - .github/workflows/refresh-eraser-layout-lock.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm add @eraserlabs/layout@0.1.0 --filter @notespace/web --lockfile-only --save-exact
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build(web): add Eraser layout router"
          git push origin HEAD:master
