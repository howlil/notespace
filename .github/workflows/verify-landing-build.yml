name: Verify landing

# One lightweight landing-specific gate. Core app CI already runs the root
# build; Cloudflare handles deployment outside GitHub Actions.
on:
  pull_request:
    paths:
      - "landing/**"
      - "wrangler.jsonc"
      - "package.json"
      - "Dockerfile"
      - ".github/workflows/verify-landing-build.yml"
  push:
    branches: [master]
    paths:
      - "landing/**"
      - "wrangler.jsonc"
      - "package.json"
      - "Dockerfile"
      - ".github/workflows/verify-landing-build.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify landing UI and Cloudflare root deployment configuration
        run: node --test tests/hero.test.mjs tests/workers-root.test.mjs tests/windows-release.test.mjs
      - name: Validate static output
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
            assert.equal(config.assets.directory, "./dist");
            assert.ok(!("main" in config), "landing must remain static");
            assert.ok(existsSync("dist/index.html"), "Astro must emit dist/index.html");
          '
