name: Patch directional spawn state once
on:
  push:
    paths:
      - .github/workflows/patch-directional-spawn-state-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/web/src/integrations/canvas/CanvasEditor.tsx')
          text = path.read_text()

          old = '  const api = useRef<ExcalidrawImperativeAPI | null>(null);\n  const last = useRef("");'
          new = '  const api = useRef<ExcalidrawImperativeAPI | null>(null);\n  const latestAppStateRef = useRef<AppState | null>(null);\n  const last = useRef("");'
          if old not in text:
              raise SystemExit('api ref marker not found')
          text = text.replace(old, new, 1)

          old = '  const changed = useCallback((elements: readonly OrderedExcalidrawElement[], state: AppState, files: BinaryFiles) => {\n    setActiveTool(state.activeTool.type);'
          new = '  const changed = useCallback((elements: readonly OrderedExcalidrawElement[], state: AppState, files: BinaryFiles) => {\n    latestAppStateRef.current = state;\n    setActiveTool(state.activeTool.type);'
          if old not in text:
              raise SystemExit('changed marker not found')
          text = text.replace(old, new, 1)

          old = '  const onInitialize = useCallback((value: ExcalidrawImperativeAPI) => {\n    api.current = value;\n    setCanvasApi(value);\n    setZoom(value.getAppState().zoom.value);'
          new = '  const onInitialize = useCallback((value: ExcalidrawImperativeAPI) => {\n    api.current = value;\n    latestAppStateRef.current = value.getAppState();\n    setCanvasApi(value);\n    setZoom(value.getAppState().zoom.value);'
          if old not in text:
              raise SystemExit('initialize marker not found')
          text = text.replace(old, new, 1)

          old = '    const state = value.getAppState() as AppState & { editingLinearElement?: unknown };'
          new = '    const state = (latestAppStateRef.current ?? value.getAppState()) as AppState & { editingLinearElement?: unknown };'
          if old not in text:
              raise SystemExit('state read marker not found')
          text = text.replace(old, new, 1)

          text = text.replace('      event.preventDefault();\n      event.stopPropagation();\n      void applyDiagram', '      event.preventDefault();\n      event.stopImmediatePropagation();\n      void applyDiagram', 1)
          text = text.replace('    event.preventDefault();\n    event.stopPropagation();\n    const created', '    event.preventDefault();\n    event.stopImmediatePropagation();\n    const created', 1)

          old = '    value.updateScene({\n      elements: nextElements,\n      appState: { selectedElementIds: { [plan.shapeId]: true } },\n      captureUpdate: CaptureUpdateAction.IMMEDIATELY,\n    });'
          new = '    latestAppStateRef.current = { ...state, selectedElementIds: { [plan.shapeId]: true } };\n    value.updateScene({\n      elements: nextElements,\n      appState: { selectedElementIds: { [plan.shapeId]: true } },\n      captureUpdate: CaptureUpdateAction.IMMEDIATELY,\n    });'
          if old not in text:
              raise SystemExit('updateScene marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/integrations/canvas/CanvasEditor.tsx
          git commit -m "fix(canvas): preserve directional spawn selection state"
          git push origin HEAD:master
