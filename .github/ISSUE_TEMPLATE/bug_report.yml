name: Bug report
description: Report a reproducible problem in Notespace.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. For vulnerabilities, read SECURITY.md instead of posting details here.
        Do not attach private notes, backups, databases, credentials or tokens.
  - type: input
    id: version
    attributes:
      label: Notespace version or commit
      placeholder: "Release tag or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Windows desktop
        - Self-hosted browser
        - Local development
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser or deployment details as applicable.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use minimal steps and synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Remove secrets and private data.
