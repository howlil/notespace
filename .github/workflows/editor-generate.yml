name: Editor Generate

on:
  push:
    branches: [feat/editor-completeness]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[editor-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate editor implementation
        shell: bash
        env:
          EDITOR_GZIP_BASE64: 
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          target = Path('apps/web/src/integrations/document/DocumentEditor.tsx')
          target.write_bytes(gzip.decompress(base64.b64decode(os.environ['EDITOR_GZIP_BASE64'])))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/integrations/document/DocumentEditor.tsx
          git commit -m 'feat(editor): complete note authoring interactions [editor-generated] [skip ci]'
          git push
