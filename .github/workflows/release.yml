name: Release image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing stable tag at master (v1.2.3). Blank publishes SHA tag only; never starts desktop release."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  packages: write

concurrency:
  group: notespace-container-release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require verified master and explicit stable image version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "::error::Publish images from verified master, never a desktop tag."
            exit 1
          fi
          stable='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ -n "$IMAGE_VERSION" && ! "$IMAGE_VERSION" =~ $stable ]]; then
            echo "::error::Image version must be stable vMAJOR.MINOR.PATCH; beta tags cannot update latest."
            exit 1
          fi
          node scripts/release/assert-desktop-release-ci.mjs --collect "$GITHUB_SHA"
      - name: Bind image version to immutable source tag
        if: inputs.version != ''
        shell: bash
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$IMAGE_VERSION:refs/tags/$IMAGE_VERSION"
          candidate=$(git rev-parse "refs/tags/$IMAGE_VERSION^{commit}")
          if [[ "$candidate" != "$GITHUB_SHA" ]]; then
            echo "::error::Image version tag must point at this verified master SHA; never reuse a version for different source."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/notespace
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
