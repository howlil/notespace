name: Format review remediation Go
on:
  push:
    branches: [feat/desktop-m6-review-remediation]
    paths:
      - "apps/server/cmd/notespace/desktop_session.go"
      - "apps/server/cmd/notespace/desktop_session_test.go"
      - "apps/server/cmd/notespace/server.go"
      - ".github/workflows/format-m6-go.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-m6-review-remediation
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - name: Format modified Go sources
        run: gofmt -w apps/server/cmd/notespace/desktop_session.go apps/server/cmd/notespace/desktop_session_test.go apps/server/cmd/notespace/server.go
      - name: Commit formatting
        run: |
          git add apps/server/cmd/notespace/desktop_session.go apps/server/cmd/notespace/desktop_session_test.go apps/server/cmd/notespace/server.go
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(desktop): gofmt reviewed auth and runtime sources"
          git push origin HEAD:feat/desktop-m6-review-remediation
