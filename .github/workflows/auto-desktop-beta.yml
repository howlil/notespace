name: Auto Desktop Beta

# Publish the first unsigned beta automatically, or a later beta only when
# an explicitly requested master commit subject contains [desktop-beta].
# Never publish every push, bypass CI, or replace an immutable release.
# Runs when master push checks complete; the first completion waits for both.
on:
  workflow_run:
    workflows:
      - Verify
      - Verify Desktop
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: notespace-auto-desktop-beta
  cancel-in-progress: false

jobs:
  dispatch-if-green:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dispatch first free beta only when master is verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          master_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$master_sha" != "$TRIGGER_SHA" ]]; then
            echo "Trigger refers to superseded master commit; skip"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$master_sha&event=push&per_page=100" > "$RUNNER_TEMP/master-ci.json"
          if ! node scripts/assert-desktop-release-ci.mjs "$RUNNER_TEMP/master-ci.json" "$master_sha"; then
            echo "Both master verification suites have not passed; the other completion will retrigger"
            exit 0
          fi

          # The first beta is automatic. Every subsequent beta requires an
          # explicit opt-in marker in the first line of the verified master
          # commit subject. That marker is passed only by an intentional merge.
          subject=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$master_sha" --jq '.message' | head -n 1)
          explicit=false
          if [[ "$subject" == *"[desktop-beta]"* ]]; then
            explicit=true
          fi

          gh release list --limit 100 --json tagName,isDraft > "$RUNNER_TEMP/desktop-releases.json"
          if node -e '
            const fs = require("node:fs");
            const releases = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            process.exit(releases.some(x => !x.isDraft && /^v0\.1\.0-beta\.[1-9]\d*$/.test(x.tagName)) ? 0 : 1);
          ' "$RUNNER_TEMP/desktop-releases.json"; then
            if [[ "$explicit" != "true" ]]; then
              echo "A beta has already been published and this commit did not request [desktop-beta]; skip"
              exit 0
            fi
          fi

          # Avoid republishing the same master commit if its checks are rerun.
          # This is independent of tag/version numbering and of queued runs.
          gh run list --workflow publish-desktop-beta.yml --limit 100 --json headSha,status,conclusion > "$RUNNER_TEMP/beta-runs.json"
          if node -e '
            const fs = require("node:fs");
            const runs = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const sha = process.argv[2];
            process.exit(runs.some(x => x.headSha === sha && x.status === "completed" && x.conclusion === "success") ? 0 : 1);
          ' "$RUNNER_TEMP/beta-runs.json" "$master_sha"; then
            echo "Desktop beta for this verified master commit already completed; skip"
            exit 0
          fi

          queued=$(node -e '
            const fs = require("node:fs");
            const runs = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const active = ["queued", "in_progress", "waiting", "pending", "requested"];
            process.stdout.write(String(runs.filter(x => active.includes(x.status)).length));
          ' "$RUNNER_TEMP/beta-runs.json")
          if [[ "$queued" != "0" ]]; then
            echo "A desktop beta release is already building; skip"
            exit 0
          fi

          gh workflow run publish-desktop-beta.yml --ref master
          echo "Dispatched free Windows MSI beta for master $master_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: https://github.com/$GITHUB_REPOSITORY/actions/workflows/publish-desktop-beta.yml" >> "$GITHUB_STEP_SUMMARY"
