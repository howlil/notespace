name: Refresh M3 Cargo Lockfile

on:
  push:
    branches:
      - feat/desktop-m3-signed-updates
    paths:
      - "apps/desktop/src-tauri/Cargo.toml"
      - "apps/desktop/src-tauri/Cargo.lock"
      - ".github/workflows/refresh-m3-cargo-lock.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/desktop-m3-signed-updates
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve new updater dependencies while preserving pinned transitive versions
        run: cargo fetch --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit generated Cargo lockfile
        shell: bash
        run: |
          git add apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Cargo.lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(desktop): lock official Tauri updater dependencies"
          git push origin HEAD:feat/desktop-m3-signed-updates
