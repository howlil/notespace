name: Verify
on:
  pull_request:
  push:
    branches: [master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  verify:
    # Chrome is available on the runner; WebdriverIO manages the driver.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      # Dependency-resolution transition: capture generated lock diff once;
      # restore frozen installs after the lockfile is committed.
      - name: Resolve WebdriverIO lockfile
        run: |
          pnpm install --no-frozen-lockfile
          echo WDIO_LOCK_DIFF_BEGIN
          git diff -- pnpm-lock.yaml
          echo WDIO_LOCK_DIFF_END
      - name: Build web for PR
        if: github.event_name == 'pull_request'
        run: pnpm --filter @notespace/web build
      - name: Build web and landing on master
        if: github.event_name == 'push'
        run: pnpm build
      - run: pnpm typecheck && pnpm lint && pnpm test
      - run: node ../../scripts/check-gofmt.mjs && go vet ./... && go test -race ./... && CGO_ENABLED=0 go build ./cmd/notespace
        working-directory: apps/server
      - name: Check standalone WebdriverIO runner syntax
        run: node --check scripts/web-e2e.mjs
      # Fast PR proof; complete browser regression protects the release SHA.
      - name: Run critical browser suite on PR
        if: github.event_name == 'pull_request'
        run: pnpm test:e2e:critical
      - name: Run critical WebdriverIO suite on master
        if: github.event_name == 'push'
        run: pnpm test:e2e:critical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/*.png
            playwright-report/
          retention-days: 7
      # Full deployment durability remains a fail-closed master release gate.
      - run: docker compose -f compose.yaml config
        if: github.event_name == 'push'
      - run: docker compose -f compose.yaml -f compose.ci.yaml up --build -d --wait
        if: github.event_name == 'push'
      - run: python3 scripts/smoke-persistence.py --compose-restart
        if: github.event_name == 'push'
        env:
          COMPOSE_FILE: compose.yaml:compose.ci.yaml
      - run: docker compose -f compose.yaml -f compose.ci.yaml logs && docker compose -f compose.yaml -f compose.ci.yaml down
        if: always() && github.event_name == 'push'
