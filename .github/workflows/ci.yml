name: ci

# Authoritative PR/master gate and separately named full regression.
# ci / gate is required on master; publishers require its exact master push run/attempt.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

env:
  CI_EVENT: ${{ github.event_name }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      web: ${{ steps.plan.outputs.web }}
      server: ${{ steps.plan.outputs.server }}
      landing: ${{ steps.plan.outputs.landing }}
      browser: ${{ steps.plan.outputs.browser }}
      desktop: ${{ steps.plan.outputs.desktop }}
      release_policy: ${{ steps.plan.outputs.release_policy }}
      compose: ${{ steps.plan.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Prove classifier and gate before selecting any jobs
        run: node --experimental-strip-types --test tests/ci-policy.test.ts
      - id: plan
        name: Classify complete merge-base diff (unknown means full)
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/verify/ci.mjs classify

  web:
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify/ci.mjs identity
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun run test
      - run: bun run --filter @notespace/web build
      - uses: actions/upload-artifact@v4
        if: needs.classify.outputs.browser == 'true'
        with:
          name: ci-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/dist/client
          if-no-files-found: error
          retention-days: 1

  server:
    needs: classify
    if: needs.classify.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify/ci.mjs identity
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      # Server ownership includes transactions/concurrency: keep real SQLite/race.
      - working-directory: apps/server
        run: node ../../scripts/verify/check-gofmt.mjs && go vet ./... && go test -race ./... && CGO_ENABLED=0 go build ./cmd/notespace

  landing:
    needs: classify
    if: needs.classify.outputs.landing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify/ci.mjs identity
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('landing/bun.lock') }}
      - run: bun install --cwd landing --frozen-lockfile
      - run: bun run --cwd landing build
      - working-directory: landing
        run: node --test tests/hero.test.mjs tests/workers-root.test.mjs tests/windows-release.test.mjs

  browser:
    needs: [classify, web]
    if: needs.classify.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify/ci.mjs identity
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: ci-web-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/dist/client
      - name: Run fresh stage proof (PR affected, master critical plus P0, regression full)
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGED_FILES: ${{ runner.temp }}/ci-browser-paths.json
        run: |
          MODE="$(node scripts/verify/ci.mjs browser-mode)"
          if [ "$MODE" = affected ]; then
            node scripts/verify/ci.mjs paths
            node scripts/verify/browser-e2e.mjs --mode affected --changed-files "$CHANGED_FILES"
          else
            node scripts/verify/browser-e2e.mjs --mode "$MODE"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ci-browser-failure
          path: test-results/*.png
          retention-days: 7

  desktop:
    needs: classify
    if: needs.classify.outputs.desktop == 'true'
    # Reuse real Windows native close/flush/shutdown/readback, not a green stub.
    uses: ./.github/workflows/verify-desktop.yml
    with:
      profile: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'regression' || 'native' }}

  compose:
    needs: classify
    if: needs.classify.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify/ci.mjs identity
      - run: docker compose -f compose.yaml config
      - run: docker compose -f compose.yaml -f compose.ci.yaml up --build -d --wait
      - name: Prove real SQLite state across container restart
        env:
          COMPOSE_FILE: compose.yaml:compose.ci.yaml
        run: python3 scripts/verify/smoke-persistence.py --compose-restart
      - name: Collect Compose logs and tear down even on failure
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml logs
          docker compose -f compose.yaml -f compose.ci.yaml down

  release-policy:
    needs: classify
    if: needs.classify.outputs.release_policy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: identity
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify/ci.mjs identity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet "PyYAML==6.0.3"
      - run: python scripts/verify/test-desktop-workflow-yaml.py
      - run: python scripts/verify/test-desktop-upgrade-inventory.py
      - run: node --test scripts/release/*.test.mjs scripts/assets/*.test.mjs scripts/verify/*.test.mjs

  gate:
    name: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'regression / gate' || 'ci / gate' }}
    if: always()
    needs: [classify, web, server, landing, browser, desktop, release-policy, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require the fresh exact-SHA plan and every required result
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/verify/ci.mjs gate
