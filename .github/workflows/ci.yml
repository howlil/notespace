name: ci
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_target != 'regression' && inputs.candidate_target != '' && format('ci candidate ({0})', inputs.candidate_target) || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ci regression' || format('ci ({0})', github.event_name) }}

# Single PR/master gate plus explicit exact-SHA candidate proof and scheduled/manual full regression.
# ci / gate is the required check; publishers require exact master push ci / gate plus target lanes
# (from that push run or an explicit exact-SHA candidate / <target> run, never generic regression).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      candidate_target:
        description: "Regression (default) or explicit exact-SHA release candidate target"
        type: choice
        required: false
        default: regression
        options: [regression, desktop, image]
  schedule:
    - cron: "17 3 * * *"

env:
  CI_EVENT: ${{ github.event_name }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && (inputs.candidate_target || 'regression') || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      web: ${{ steps.plan.outputs.web }}
      server: ${{ steps.plan.outputs.server }}
      landing: ${{ steps.plan.outputs.landing }}
      browser: ${{ steps.plan.outputs.browser }}
      desktop: ${{ steps.plan.outputs.desktop }}
      release_policy: ${{ steps.plan.outputs.release_policy }}
      compose: ${{ steps.plan.outputs.compose }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Prove lane selection before trusting it
        run: node --test scripts/verify/ci-plan.test.mjs
      - id: plan
        name: Select lanes from the changed paths (unknown means every lane)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CANDIDATE_TARGET: ${{ inputs.candidate_target }}
        run: node scripts/verify/ci-plan.mjs plan

  web:
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun run test
      # Exactly one web build: browser owns it when selected, otherwise web does.
      - run: bun run --filter @notespace/web build
        if: needs.classify.outputs.browser != 'true'

  server:
    needs: classify
    if: needs.classify.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      # Server ownership includes transactions/concurrency: keep real SQLite/race.
      - working-directory: apps/server
        run: node ../../scripts/verify/check-gofmt.mjs && go vet ./... && go test -race ./... && CGO_ENABLED=0 go build ./cmd/notespace

  landing:
    needs: classify
    if: needs.classify.outputs.landing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('landing/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-
      - run: bun install --cwd landing --frozen-lockfile
      - run: bun run --cwd landing build
      - working-directory: landing
        run: node --test tests/hero.test.mjs tests/workers-root.test.mjs tests/windows-release.test.mjs
      # Static-site deployment contract.
      - working-directory: landing
        run: |
          node --input-type=module -e '
            import { existsSync, readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
            assert.equal(config.assets.directory, "./dist");
            assert.ok(!("main" in config), "landing must remain static");
            assert.ok(existsSync("dist/index.html"), "Astro must emit dist/index.html");
          '

  browser:
    # Prepare/build independently of the web lane; the gate still requires both.
    needs: classify
    if: needs.classify.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/server/go.mod
          cache-dependency-path: apps/server/go.sum
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.3.14-
      - run: bun install --frozen-lockfile
      # Fresh production build in the same checkout/process environment as proof.
      - run: bun run --filter @notespace/web build
      - name: Run browser proof (PR affected + smoke, master/candidate critical + P0, regression full)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGED_FILES: ${{ runner.temp }}/ci-browser-paths.json
          CANDIDATE_TARGET: ${{ inputs.candidate_target }}
        run: |
          MODE="$(node scripts/verify/ci-plan.mjs mode)"
          if [ "$MODE" = affected ]; then
            node scripts/verify/browser-e2e.mjs --mode affected --changed-files "$CHANGED_FILES"
          else
            node scripts/verify/browser-e2e.mjs --mode "$MODE"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ci-browser-failure
          path: test-results/*.png
          retention-days: 7

  desktop:
    needs: classify
    if: needs.classify.outputs.desktop == 'true'
    # Reuse real Windows native close/flush/shutdown/readback, not a green stub.
    uses: ./.github/workflows/verify-desktop.yml
    with:
      profile: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.candidate_target == '' || inputs.candidate_target == 'regression'))) && 'regression' || 'native' }}

  compose:
    needs: classify
    if: needs.classify.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build container image with BuildKit cache
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          tags: notespace:ci
          cache-from: type=gha,scope=compose
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'type=gha,mode=max,scope=compose' || '' }}
      - run: docker compose -f compose.yaml -f compose.ci.yaml config
      - run: docker compose -f compose.yaml -f compose.ci.yaml up --no-build -d --wait
      - name: Prove real SQLite state across container restart
        env:
          COMPOSE_FILE: compose.yaml:compose.ci.yaml
        run: python3 scripts/verify/smoke-persistence.py --compose-restart
      - name: Collect Compose logs and tear down even on failure
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml logs
          docker compose -f compose.yaml -f compose.ci.yaml down

  release-policy:
    needs: classify
    if: needs.classify.outputs.release_policy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet "PyYAML==6.0.3"
      - run: python scripts/verify/test-desktop-workflow-yaml.py
      - run: python scripts/verify/test-desktop-upgrade-inventory.py
      - run: node --test scripts/release/*.test.mjs scripts/assets/*.test.mjs scripts/verify/*.test.mjs

  gate:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_target != 'regression' && inputs.candidate_target != '' && format('candidate / {0}', inputs.candidate_target) || (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'regression / gate' || 'ci / gate' }}
    if: always()
    needs: [classify, web, server, landing, browser, desktop, release-policy, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Require every selected lane to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node scripts/verify/ci-plan.mjs gate
