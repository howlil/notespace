name: Feature request
description: Propose a focused improvement to Notespace.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Describe what you are trying to accomplish and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should the user be able to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing workarounds, related issues or trade-offs.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional examples or screenshots using non-sensitive data.
