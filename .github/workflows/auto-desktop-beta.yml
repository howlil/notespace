name: Auto Desktop Beta

# One-shot bootstrap only: automatically publish the FIRST unsigned beta after
# both master CI workflows pass. Never publish every push or replace releases.
# Runs on the completion of both workflows; the first completion skips until
# the other check has passed.
on:
  workflow_run:
    workflows:
      - Verify
      - Verify Desktop
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: notespace-auto-desktop-beta
  cancel-in-progress: false

jobs:
  dispatch-if-green:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Dispatch first free beta only when master is verified
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          master_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" && "$master_sha" != "$TRIGGER_SHA" ]]; then
            echo "Trigger refers to superseded master commit; skip"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$master_sha&event=push&per_page=100" > "$RUNNER_TEMP/master-ci.json"
          if ! node scripts/assert-desktop-release-ci.mjs "$RUNNER_TEMP/master-ci.json" "$master_sha"; then
            echo "Both master verification suites have not passed; the other completion will retrigger"
            exit 0
          fi

          # This automation bootstraps only the first public beta, never ships
          # later changes by surprise. Subsequent releases stay explicit.
          if gh release list --limit 100 --json tagName,isDraft | node -e '
            let s=""; process.stdin.on("data",d=>s+=d);
            process.stdin.on("end",()=> {
              const releases=JSON.parse(s);
              process.exit(releases.some(x=>!x.isDraft && /^v0\\.1\\.0-beta\\.[1-9]\\d*$/.test(x.tagName))?0:1);
            });
          '; then
            echo "At least one beta already published; no automatic release needed"
            exit 0
          fi

          # Dispatch once; skip if build already queued/running. The beta
          # release workflow also verifies master CI and serializes publication.
          queued=$(gh run list --workflow publish-desktop-beta.yml --limit 30 --json status --jq '[.[]|select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")] | length')
          if [[ "$queued" != "0" ]]; then
            echo "A desktop beta release is already building; skip"
            exit 0
          fi

          gh workflow run publish-desktop-beta.yml --ref master
          echo "Dispatched free Windows MSI beta for master $master_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Workflow: https://github.com/$GITHUB_REPOSITORY/actions/workflows/publish-desktop-beta.yml" >> "$GITHUB_STEP_SUMMARY"
